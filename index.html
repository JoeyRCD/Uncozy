<script>
// ─── SETUP ───────────────────────────────────────────────────
const T = 16, VW = 16, VH = 15, GW = VW * T, GH = VH * T;
const cv = document.getElementById('c'); let ctx = cv.getContext('2d'); const mainCtx = ctx;
cv.width = GW; cv.height = GH;
ctx.imageSmoothingEnabled = false;

function resize() {
  let s = Math.min(innerWidth / GW, innerHeight / GH);
  if (s >= 1) s = Math.floor(s);
  cv.style.width = GW * s + 'px';
  cv.style.height = GH * s + 'px';
}
addEventListener('resize', resize); resize();

const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ─── KARTE ───────────────────────────────────────────────────
let MW = 82, MH = 36, curMap = 'town';
let M = Array.from({ length: MH }, () => Array(MW).fill('.'));
const rect = (x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) M[j][i] = c; };
const set = (x, y, c) => { M[y][x] = c; };
const hedge = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) M[j][i] = hash(i, j) % 3 === 0 ? 'f' : 'b'; };

// Texte für einzelne Felder (Schilder, Türen), Schlüssel "karte:x,y"
const SPOT_TEXT = {};
const spot = (x, y) => curMap + ':' + x + ',' + y;
const HOUSES = [];
function house(x, y, owner, gen, pathLen) {
  rect(x, y, 5, 2, 'r');
  rect(x, y + 2, 5, 2, 'h');
  set(x + 1, y + 2, 'n'); set(x + 3, y + 2, 'n');
  set(x + 2, y + 3, 'd');
  rect(x + 2, y + 4, 1, pathLen, 's');           // Weg von der Tür
  set(x + 3, y + 4, 'x');                        // Schild neben der Tür
  SPOT_TEXT[spot(x + 3, y + 4)] = ['~ ' + gen + ' Haus ~', 'Hier wohnt ' + owner + '.'];
  HOUSES.push({ owner, door: { x: x + 2, y: y + 3 } });
}

// ── Stadt ──
rect(0, 0, 1, MH, 't'); rect(MW - 1, 0, 1, MH, 't');
rect(1, 0, 13, 3, 't'); rect(30, 0, 13, 3, 't');
rect(14, 0, 3, 2, 't'); rect(27, 0, 3, 2, 't');

hedge(43, 0, MW - 44, MH);
// Darin versteckt: ein langer, verwinkelter Gang. Die Felder sehen aus wie normale Hecke,
// man kann sie nur betreten (siehe SECRET in passable()).
const TUNNEL = [[43, 5], [55, 5], [55, 14], [68, 14], [68, 3], [78, 3]];
const tunnelTiles = [];
for (let i = 0; i < TUNNEL.length - 1; i++) {
  let [x, y] = TUNNEL[i]; const [x2, y2] = TUNNEL[i + 1];
  while (x !== x2 || y !== y2) { tunnelTiles.push([x, y]); x += Math.sign(x2 - x); y += Math.sign(y2 - y); }
}
tunnelTiles.push(TUNNEL[TUNNEL.length - 1]);
const PORTAL = { x: 79, y: 3 };   // Übergang ins Nichts (sieht auch aus wie Hecke)
const SECRET = new Set([...tunnelTiles, [PORTAL.x, PORTAL.y]].map(([x, y]) => x + ',' + y));
rect(0, MH - 1, MW, 1, 'm');
// Teich + Brücke
rect(17, 0, 10, 6, 'w');
for (let y = 3; y < 6; y++) { set(21, y, '['); set(22, y, ']'); }
// Die Brücke ist zerstört: abgebrochene Planken, danach nur noch Wasser und ein paar Pfosten
set(21, 2, '{'); set(22, 2, '}');
set(21, 1, 'p'); set(22, 0, 'p');
// Wege
rect(21, 6, 2, MH - 6, 's');      // Hauptweg bis zum Tor
rect(17, 7, 10, 4, 's');          // Platz
rect(2, 13, 40, 2, 's');          // Querweg oben
rect(2, 23, 40, 2, 's');          // Querweg unten
// Häuser – jeder Bewohner hat eins
house(3, 7,  'Danny',  'Dannys', 2);
// Dannys Schmiede: Schieferdach mit Schornstein, Steinmauern, glühende Esse, Schild, Amboss und Kohle vor der Tür
(function smithyFront(x, y) {
  rect(x, y, 5, 2, '1'); set(x + 3, y, '2');               // Schieferdach + Schornstein
  set(x, y + 2, 'e'); set(x + 1, y + 2, 'i'); set(x + 2, y + 2, 'z'); set(x + 3, y + 2, 'i'); set(x + 4, y + 2, 'e');
  set(x, y + 3, 'e'); set(x + 1, y + 3, 'e'); set(x + 3, y + 3, 'e'); set(x + 4, y + 3, 'e');
  set(x, y + 4, '3');                                        // Amboss draußen
  set(x + 4, y + 4, '4');                                    // Kohlehaufen
  SPOT_TEXT[spot(x + 3, y + 4)] = ['~ Dannys Schmiede ~', 'Hier wohnt und hämmert Danny.'];
})(3, 7);
const CHIMNEY = { x: 6, y: 7 };
house(10, 7, 'Gustav', 'Gustavs', 2);
house(29, 7, 'Paul',   'Pauls', 2);
house(36, 7, 'Lucy',   'Lucys', 2);
house(3, 16, 'Crisi', 'Crisis', 3);
rect(2, 21, 3, 1, 'k');           // Blumenbeet unter Crisis Haus
house(10, 16, 'Tony',  'Tonys', 3);
// Tonys Tischlerei: Schild mit Säge über der Tür, Holzstapel und Sägebock vor dem Haus
set(12, 18, '#');
set(10, 20, '9'); set(11, 20, '9'); set(14, 20, '0');
SPOT_TEXT[spot(13, 20)] = ['~ Tonys Tischlerei ~', 'Stühle, Tische, Brücken. Hier wohnt Tony.'];
house(29, 16, 'Joyce', 'Joyces', 3);
house(36, 16, 'Otto',  'Ottos', 3);
house(8, 25, 'Raaven', 'Raavens', 2);
// Crisis Blumenladen: gestreifte Markise, Schaufenster, Ladenschild, Blumenkästen und Töpfe vor der Tür
(function shopFront(x, y) {
  rect(x, y + 1, 5, 1, 'a');                       // Markise
  set(x, y + 2, 'g'); set(x + 1, y + 2, 'g');       // Schaufenster links
  set(x + 2, y + 2, 'j');                          // Ladenschild über der Tür
  set(x + 3, y + 2, 'g'); set(x + 4, y + 2, 'g');   // Schaufenster rechts
  set(x, y + 3, 'l'); set(x + 1, y + 3, 'l'); set(x + 3, y + 3, 'l'); set(x + 4, y + 3, 'l');   // Blumenkästen
  set(x + 1, y + 4, 'y'); set(x + 4, y + 4, 'y');   // Blumentöpfe vor dem Laden
  SPOT_TEXT[spot(x + 3, y + 4)] = ['~ Crisis Blumenladen ~', 'Samen und Blumen. Hier wohnt Crisi.'];
})(3, 16);
// Hecken
hedge(14, 2, 3, 4); hedge(27, 2, 3, 4);
hedge(15, 11, 5, 2); hedge(24, 11, 5, 2);
hedge(16, 16, 3, 4); hedge(25, 16, 3, 4);
hedge(4, 27, 3, 2); hedge(14, 27, 4, 2); hedge(26, 27, 14, 2);   // links Platz für Raavens Haus
// Deko
set(24, 8, 'u');                  // Brunnen
set(20, 12, 'x');                 // Ortsschild
SPOT_TEXT[spot(20, 12)] = ['~ UNCOZYCRAFT ~\nNorden: Brücke\nSüden: Stadttor'];
[[8, 8], [8, 18], [34, 8], [34, 18], [6, 32], [37, 32]].forEach(([x, y]) => set(x, y, 't'));
// zusätzliche Bäume in den freien Wiesen
// Laternen an den Wegen (leuchten nachts)
[[14, 15], [29, 15], [20, 25], [24, 26], [19, 6], [41, 24]].forEach(([x, y]) => { if (M[y][x] === '.' || M[y][x] === 'o') set(x, y, '^'); });
[[2, 4], [11, 4], [6, 5], [33, 4], [39, 3], [41, 5], [32, 32], [35, 29], [15, 31], [17, 33], [29, 34], [1, 22], [42, 20]].forEach(([x, y]) => { if (M[y][x] === '.') set(x, y, 't'); });
// Gemeinschaftsgarten unten rechts: zwei Beetreihen mit einem Kiesweg dazwischen
rect(24, 30, 6, 1, 'k'); rect(24, 32, 6, 1, 'k');
rect(23, 31, 8, 1, 's');
set(23, 30, 'x');
SPOT_TEXT[spot(23, 30)] = ['~ Gemeinschaftsgarten ~', 'Hier darf jeder pflanzen.'];
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++)
  if (M[y][x] === '.' && hash(x, y) % 13 === 0) M[y][x] = 'o';
const TOWN = { M, MW, MH };

// ── Durchlauf: nach dem Ende an der Brücke beginnt alles von vorn (Durchlauf 2). Zurücksetzen mit ?neu in der Adresse ──
// Startmodus: 'checkpoint' = direkt an der frühesten Stelle mit neuen Änderungen (siehe applyCheckpoint),
//             'fresh' = mit N auf dem Titelbild: komplett von vorn, 'story' = automatischer Neustart nach einem Kapitel-Ereignis,
//             'normal' = Upload-Version (index.html): Titelbild + Intro, gespeicherter Durchlauf und Name bleiben erhalten
const CHECKPOINT_LOOP = 1;
const START_MODE = (() => { try {
  if (location.search.includes('neu')) { localStorage.removeItem('uncozy_loop'); return 'fresh'; }
  if (sessionStorage.getItem('uncozy_autointro')) return 'story';
  if (sessionStorage.getItem('uncozy_fresh')) { sessionStorage.removeItem('uncozy_fresh'); return 'fresh'; }
} catch (e) {} return 'normal'; })();   // Upload-Version: Titelbild + Intro, Name und Durchlauf bleiben
const LOOP = START_MODE === 'story' || START_MODE === 'normal' ? (() => { try { return +localStorage.getItem('uncozy_loop') || 1; } catch (e) { return 1; } })() : START_MODE === 'fresh' ? 1 : CHECKPOINT_LOOP;
// ── Das Glitchhaus von innen: viel größer, als es von außen aussieht ──
const GLITCHHAUS = (() => {                       // ein endlos langer Saal
  const block = ['WFFFFFFFFFFFFFW', 'WFTTFFFFFFFTTFW', 'WFFFFFFFFFFFFFW', 'WYFFFFFFFFFFFYW', 'WFFFFFFFFFFFFFW'];
  const rows = ['WWWWWWW~WWWWWWW', 'WLLLFFFFFFFLLLW'];
  while (rows.length < 33) rows.push(...block);
  rows.length = 33; rows.push('WFFFFFFFFFFFFFW', 'WWWWWWWEWWWWWWW');
  return { MW: 15, MH: rows.length, M: rows.map(r => r.split('')) };
})();
const RAETSEL = { MW: 13, MH: 11, M: [
  'WWWWWWWWWWWWW',
  'WFFFFFFFFFFFW',
  'WFFFFFFFFFFFW',
  'WFFFFFFFFFFFW',
  'WFFFFFFFFFFFW',
  'WFFFFFFFFFFFW',
  'WF$F$F$F$F$FW',
  'WFFFFFFFFFFFW',
  'WFF$FF$FF$FFW',
  'WFFFFFFFFFFFW',
  'WWWWWWWWWWWWW',
].map(r => r.split('')) };
const JENSEITS = { MW: 14, MH: 16, M: [
  '..............',
  '.....)))).....',
  '.....)**).....',
  '.....)**).....',
  '.....)**).....',
  '.....)))).....',
  '..............',
  '..............',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
  'wwwwww<>wwwwww',
].map(r => r.split('')) };
let fleshBridge = LOOP >= 4, gustavGone = LOOP >= 4;
const GLITCH_FLOOR = [[5, 6], [11, 11], [4, 17], [9, 22], [3, 27], [12, 30]];
// ── Die Leere: nur Schwarz, ganz oben das verglitchte Haus ──
const GLITCH = new Set(['R', 'H', 'N', 'D', 'X']);
var MAPS_EXTRA;
curMap = 'void'; MW = 21; MH = 70;
M = Array.from({ length: MH }, () => Array(MW).fill('v'));
const GH_X = 10, GH_Y = 5;        // Mitte des Hauses
(function glitchHouse(x, y) {
  rect(x, y, 5, 2, 'R');
  rect(x, y + 2, 5, 2, 'H');
  set(x + 1, y + 2, 'N'); set(x + 3, y + 2, 'N');
  set(x + 2, y + 3, 'D');
  set(x + 3, y + 4, 'X');
  SPOT_TEXT[spot(x + 2, y + 3)] = ['D1e T#r 1st v3r$chl0ss3n.', 'v3rschl0ss3n.', 'v e r s c h l o s s e n'];
})(8, 3);
const GLITCH_SIGN = spot(11, 7);
const VOID = { M, MW, MH };
MAPS_EXTRA = { glitchhaus: GLITCHHAUS, raetsel: RAETSEL, jenseits: JENSEITS };
// ── Innenräume: 11x8, Ausgang (E) unten in der Mitte ──
const INTERIORS = {
  Gustav: ['WWKWWWWWKWW', 'FLLLLLFFFQF', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFGGGFFFFF', 'FFFGGGFFFCF', 'PFFFFFFFFFF', 'WWWWWEWWWWW'],
  Danny:  ['WWKWWWWWKWW', 'Q55OOO5666C', 'q5555555555', '555A55J7855', '55555555555', '555GGG5555Y', '555GGG5555Y', 'WWWWWEWWWWW'],
  Paul:   ['WWKWWWWWKWW', 'QFFFFFFFFCF', 'qFFFFFFFFFF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'YYFFFFFFFFY', 'YFFFFFFFFYY', 'WWWWWEWWWWW'],
  Lucy:   ['WWKWWWWWKWW', 'PFFFFFFFFQP', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFFGGGFFFF', 'FFFFGGGFFCF', 'PFFFFFFFFFP', 'WWWWWEWWWWW'],
  Crisi: ['WWKWWWWWKWW', 'cccccPPFFQP', 'FFFFFFFFFqF', 'FZZZZZZFFFP', 'FFFFFFFFFFF', 'PFFGGGFFFFP', 'PPFFFFFFFPP', 'WWWWWEWWWWW'],
  Tony:   ['WWK&&&&&KWW', 'Q%%FFFFFF+C', 'qFFFFFFFFFF', 'FFJJFFF+FFF', 'FFFFFFFFFFF', 'FFFGGGFFF%J', '%FFGGGFFFFF', 'WWWWWEWWWWW'],
  Joyce:  ['WWKWWWWWKWW', 'OOJFFFFFFQF', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'YFFGGGFFFFP', 'YFFGGGFFFFF', 'WWWWWEWWWWW'],
  Raaven: ['WWKWWWWWKWW', 'FFFFFFFFLLL', 'FFFFFFFFFFF', 'FFFFTTFFFFC', 'FFFFFFFFFFF', 'YFFGGGFFFFP', 'FFFGGGFFFFF', 'WWWWWEWWWWW'],
  Otto:   ['WWKWWWWWKWW', 'QFFFFFFFFSS', 'qFFFFFFFFFF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'CFFGGGFFFFS', 'CFFGGGFFFFF', 'WWWWWEWWWWW'],
};
// Besondere Texte pro Bewohner und Möbelstück
const INTERIOR_TEXT = {
  Gustav: { L: ['Alle Bücher haben denselben Titel:', '"UncozyCraft - Band 1"'] },
  Danny:  { A: ['Auf dem Amboss liegt ein halbfertiger Aufziehschlüssel.', 'Viel zu groß für eine Taschenuhr.', 'Eher für eine Standuhr. Eine sehr große Standuhr.'], '6': ['Werkzeuge und Klingen hängen an der Wand.', 'Ein Haken ist leer. Da hing wohl sein Hammer.'], '7': ['Ein Haufen Kohle für die Esse.'], '8': ['Ein Wassertrog zum Abkühlen.', 'Das Wasser zischt noch leise.'], O: ['Die Esse glüht.', 'Hier ist es richtig heiß.'] },
  Paul:   { C: ['In der Truhe liegt eine Angel.', 'Der Haken ist noch nie nass geworden.'], Y: ['Die Fässer sind leer.', 'Kein einziger Fisch.'] },
  Lucy:   { Q: ['Lucys Bett.', 'Unter dem Kissen liegt eine Zeichnung: Lucy und ihre Mama vor dem Blumenladen.', 'Daneben hat sie ein schwarzes Männchen gemalt. Mit Glubschaugen.', 'Sie hat es so oft durchgestrichen, dass das Papier gerissen ist.'], q: ['Lucys Bett.', 'Unter dem Kissen liegt eine Zeichnung: Lucy und ihre Mama vor dem Blumenladen.', 'Daneben hat sie ein schwarzes Männchen gemalt. Mit Glubschaugen.', 'Sie hat es so oft durchgestrichen, dass das Papier gerissen ist.'] },
  Crisi: { P: ['Crisis Blumen.', 'Jede steht genau gleich weit vom Fenster weg.'], c: ['Ein Regal voller Samentüten.', 'Rot, gelb, weiß... alles ordentlich beschriftet.', 'Nur das Fach mit den blauen Samen ist leer.'], Z: ['Die Ladentheke. Sie glänzt frisch poliert.'] },
  Tony:   { C: ['Tonys Werkzeugkiste.', 'Ganz unten liegt ein altes Foto: Tony und ein Junge, ganz in Schwarz. Mit Glubschaugen.', 'Auf der Rückseite steht: "Mein bester Freund."', 'Das "bester" ist durchgestrichen.'], '%': ['Ein Stapel frisch gehobelter Bretter.'], '&': ['Sägen, Hobel und Hämmer hängen ordentlich an der Wand.'], '+': ['Ein halbfertiger Stuhl.', 'Er hat nur drei Beine. Absichtlich?'] },
  Joyce:  { T: ['Der Tisch ist für zwei gedeckt.'], O: ['Der Ofen ist eiskalt.', 'Hier hat schon lange niemand mehr Feuer gemacht.'] },
  Otto:   { S: ['Ottos Ersatzrüstung. Frisch poliert.'] },
  Raaven: { L: ['Raavens Regal ist voller glänzender Dinge.', 'Knöpfe, Schlüssel, Löffel...', '...und ein Glubschauge aus Glas.'], C: ['Raavens Truhe. Sie ist fest verschlossen.'] },
};
const MAPS = { town: TOWN, void: VOID };
Object.assign(MAPS, MAPS_EXTRA);
for (const owner in INTERIORS) MAPS['house:' + owner] = { M: INTERIORS[owner].map(r => r.split('')), MW: 11, MH: 8 };

if (LOOP >= 3) {                                              // 3. Durchlauf: Crisis Laden ist nur noch Asche
  const cd = HOUSES.find(h => h.owner === 'Crisi').door;
  for (let yy = cd.y - 3; yy <= cd.y; yy++) for (let xx = cd.x - 2; xx <= cd.x + 2; xx++) TOWN.M[yy][xx] = '_';
}
function buildFleshTiles() { for (let yy = 0; yy <= 5; yy++) { TOWN.M[yy][21] = '<'; TOWN.M[yy][22] = '>'; } }
if (LOOP >= 4) buildFleshTiles();     // die Brücke aus Gustav steht schon
curMap = 'town'; ({ M, MW, MH } = TOWN);

const BLOCKED = new Set([')', '*', '=', '$', '_', '~', '^', '9', '0', '#', '%', '&', '+', 'I', 'U', '1', '2', 'e', 'i', 'z', '3', '4', '6', '7', '8', 'a', 'g', 'j', 'l', 'y', 'Z', 'c', '{', '}', 'p', 'k', 't', 'b', 'f', 'w', 'r', 'h', 'n', 'm', 'x', 'u', 'd', 'R', 'H', 'N', 'D', 'X',
  'W', 'K', 'Q', 'q', 'T', 'C', 'L', 'P', 'O', 'A', 'Y', 'S', 'J']);
// Blöcke mit Höhe (Pixel) – werden als 3D-Klötze gezeichnet
const HEIGHT = { t: 10, b: 6, f: 6, m: 6, u: 4, B: 6 };

// ─── TEXTUREN ────────────────────────────────────────────────
function mk(fn, w = T, h = T) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); fn(x); return c;
}
function P(x, px, py, w, h, col) { x.fillStyle = col; x.fillRect(px, py, w, h); }
function disc(x, cx, cy, r, col) {  x.fillStyle = col;  for (let yy = 0; yy < T; yy++) for (let xx = 0; xx < T; xx++) {    const dx = xx + .5 - cx, dy = yy + .5 - cy;    if (dx * dx + dy * dy <= r * r) x.fillRect(xx, yy, 1, 1);  }}
function noise(x, pal, seed, ax = 0, ay = 0, w = T, h = T) {
  const r = rng(seed);
  for (let j = ay; j < ay + h; j++) for (let i = ax; i < ax + w; i++) P(x, i, j, 1, 1, pal[r() * pal.length | 0]);
}

const PAL = {
  grass:  ['#5f9d32', '#6aab38', '#73b63e', '#58922d', '#68a636'],
  stone:  ['#7a7a7a', '#878787', '#6e6e6e', '#939393'],
  brick:  ['#7f7f7f', '#8b8b8b', '#757575', '#929292'],
  oak:    ['#a2834f', '#b4905a', '#9c7c48', '#a98a52'],
  spruce: ['#6b4a2a', '#5f4124', '#74512e', '#553a20'],
  leaves: ['#3f8a22', '#4c9a2a', '#357a1c', '#5aa832'],
  tree:   ['#2f6e1a', '#3a7f20', '#28601a', '#468c28'],
  water:  ['#3060d8', '#3468e0', '#2c58cc', '#2a50c0'],
  log:    ['#6b5233', '#5e4a2a', '#735a38'],
};

function grassTex(x, seed) { noise(x, PAL.grass, seed); }
function leavesTex(x, pal, seed) {
  const r = rng(seed);
  for (let j = 0; j < T; j++) for (let i = 0; i < T; i++) {
    const v = r();
    P(x, i, j, 1, 1, v < .12 ? '#1f4a12' : v > .93 ? '#7cc44a' : pal[r() * pal.length | 0]);
  }
}
function planksTex(x, pal, seam, seed, vertical = false) {
  noise(x, pal, seed);
  const seams = [3, 11, 7, 13];
  for (let k = 0; k < 4; k++) {
    if (vertical) { P(x, k * 4 + 3, 0, 1, T, seam); P(x, k * 4, seams[k], 3, 1, seam); }
    else { P(x, 0, k * 4 + 3, T, 1, seam); P(x, seams[k], k * 4, 1, 3, seam); }
  }
}
function cobbleTex(x, seed) {

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0, g = Math.min(255, ((n >> 8) & 255) * f) | 0, b = Math.min(255, (n & 255) * f) | 0;

}

  for (let y = 0; y < SH; y++) for (let xx = 0; xx < SW; xx++) {
    const i = (y * SW + xx) * 4;
    if (s[i + 3]) continue;
    const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
      const X = xx + a, Y = y + b;
      return X >= 0 && X < SW && Y >= 0 && Y < SH && s[(Y * SW + X) * 4 + 3] > 0;
    });
    if (near) { o[i] = 26; o[i + 1] = 26; o[i + 2] = 26; o[i + 3] = 220; }
  }
  d.data.set(o); x.putImageData(d, 0, 0);
}

function drawClawArm(x0, y0, x1, y1, dir) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  ctx.fillStyle = '#111111';
  for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 2, 2);
  ctx.fillRect(Math.round(x1) - 1, Math.round(y1) - 1, 3, 3);                       // Hand
  ctx.fillRect(Math.round(x1) + dir * 2, Math.round(y1) - 2, 1, 1); ctx.fillRect(Math.round(x1) + dir * 2, Math.round(y1), 1, 1); ctx.fillRect(Math.round(x1) + dir * 2, Math.round(y1) + 2, 1, 1);   // Krallen
  ctx.fillStyle = '#a00000'; ctx.fillRect(Math.round(x1) + dir, Math.round(y1), 1, 1);
}

}

function drawButcher(cx, cy) {
  const b = butcher; if (!b || curMap !== 'town') return;
  const t = performance.now(), ox = Math.round(b.ax) - cx, oy = Math.round(b.ay) - cy;
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(ox + x, oy + y, w, h); };
  // Blutlache und Spritzer
  R(-6, 3, 26, 14, '#4a0000'); R(-4, 2, 22, 16, '#5a0000'); R(-2, 4, 18, 12, '#7a0000');
  for (const s of b.blood) R(Math.round(s.x), Math.round(s.y), s.w, s.h, s.c);
  // Rumpf: erst Gewand, dann offener Brustkorb
  if (!b.ribs) { R(4, 6, 8, 7, b.g.look.robe); R(4, 6, 8, 1, b.g.look.accent); }
  else {
    R(4, 6, 8, 7, '#8a1020'); R(5, 7, 6, 5, '#b03040');

  for (const p of b.parts) {
    const x = p.x + p.off[0], y = p.y + p.off[1];
    if (p.bone) {
      if (p.n === 'head') { R(x, y, 5, 5, '#e8e0d0'); R(x + 1, y + 1, 1, 2, '#1a1a1a'); R(x + 3, y + 1, 1, 2, '#1a1a1a'); R(x + 1, y + 4, 3, 1, '#8a8070'); }
      else { R(x, y, p.w, p.h, '#e8e0d0'); R(x - 1, y - 1, 2, p.h + 2, '#f0e8d8'); R(x + p.w - 1, y - 1, 2, p.h + 2, '#f0e8d8'); R(x + 1, y + p.h - 1, p.w - 2, 1, '#c8c0b0'); }
      R(x + 1, y, 1, 1, '#a00000');
    } else {
      R(x, y, p.w, p.h, p.col);
      if (p.n === 'head') { R(x, y, p.w, 1, p.end); R(x + 1, y + 2, 1, 1, '#1a1a1a'); R(x + 3, y + 2, 1, 1, '#1a1a1a'); R(x + 1, y + 4, 3, 1, p.end); }
      else R(p.n.startsWith('arm') ? x + p.w - 2 : x, y, 2, p.h, p.end);
      if (p.cut) { const sx = p.n === 'head' ? x - 1 : p.n.startsWith('arm') ? x - 1 : x + p.w; R(sx, y, 1, p.h, '#c01010'); R(sx, y + Math.floor(p.h / 2), 1, 1, '#f0e8d8'); }
    }
  }
  // Fleischhaufen neben der Leiche
  for (let i = 0; i < b.meat; i++) { const mx = 11 + (i % 4) * 3, my = 19 - Math.floor(i / 4) * 2; R(mx, my, 4, 3, i % 2 ? '#b03040' : '#902030'); R(mx + 1, my, 2, 1, '#e07080'); }
  // spritzende Tropfen
  b.drops = b.drops.filter(d => t - d.t0 < 700);
  for (const d of b.drops) { const k = t - d.t0; R(Math.round(d.x + d.vx * k), Math.round(d.y + d.vy * k + 0.0002 * k * k), 1, 1, '#c01010'); }
}

function addItem(k, n = 1) { inv[k] = (inv[k] || 0) + n; }
function removeItem(k, n = 1) { inv[k] = (inv[k] || 0) - n; if (inv[k] <= 0) delete inv[k]; }
const has = k => (inv[k] || 0) > 0;
addItem('Taler', 5);                // ein bisschen Startgeld
function jingle() { [523, 659, 784, 1047].forEach((hz, i) => setTimeout(() => blip(hz, .09), i * 90)); }
function drawInventory() {
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'start';
  // oben rechts: nur die Münzen
  const coins = String(inv.Taler || 0), cw = coins.length * 8 + 26;
  drawPanel(GW - cw - 4, 4, cw, 20);
  ctx.drawImage(ICONS.Taler, GW - cw + 1, 8);
  ctx.fillStyle = '#3f3f3f'; ctx.fillText(coins, GW - cw + 17, 10);
  // unten: Inventar-Leiste (nicht während Gesprächen, Szenen oder im Laden)
  if ((dialog && !dialog.top) || shopUI || textInput) return;   // nur ausblenden, wenn die Textbox unten liegt
  const keys = Object.keys(inv).filter(k => k !== 'Taler');
  const n = Math.max(5, keys.length), SZ = 20, x0 = Math.round((GW - n * SZ) / 2), y0 = GH - SZ - 3;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x0 - 2, y0 - 2, n * SZ + 4, SZ + 4);
  for (let i = 0; i < n; i++) {
    const sx = x0 + i * SZ;
    ctx.fillStyle = '#8b8b8b'; ctx.fillRect(sx, y0, SZ, SZ);
    ctx.fillStyle = '#373737'; ctx.fillRect(sx + 1, y0 + 1, SZ - 2, SZ - 2);
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(sx + 1, y0 + 1, SZ - 2, 1);
    const k = keys[i];
    if (!k) continue;
    ctx.drawImage(ICONS[k], sx + 4, y0 + 3);
    if (inv[k] > 1) {
      const t = String(inv[k]);
      ctx.fillStyle = '#000'; ctx.fillText(t, sx + SZ - t.length * 8 + 1, y0 + SZ - 8);
      ctx.fillStyle = '#fff'; ctx.fillText(t, sx + SZ - t.length * 8, y0 + SZ - 9);
    }
  }
}

}

const silhouetteCache = new Map();
function silhouette(look) {
  if (!silhouetteCache.has(look.id)) silhouetteCache.set(look.id, mk(x => {
    x.drawImage(sprite(look, 'down', 0), 0, 0);
    const d = x.getImageData(0, 0, SW, SH);                     // jeden sichtbaren Pixel dunkel färben
    for (let i = 0; i < d.data.length; i += 4) if (d.data[i + 3]) { d.data[i] = 74; d.data[i + 1] = 58; d.data[i + 2] = 42; }

    let line = '';
    for (const w of para.split(' ')) {
      if (!line) line = w;
      else if ((line + ' ' + w).length <= LINE_W) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

    for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));

function joeyVoice(st) {
  if (!AC || muted) return;
  const r = () => Math.random() - .5;
  if (st <= 0) { blip(880, .025); return; }                                                     // fröhliches Piepen
  if (st === 1) { blip(800 + r() * 160, .025); return; }                                        // schon leicht schief
  if (st === 2) { voiceTone(560 + r() * 220, 'square', 0.028, 0.05, 3000, 0.88, r() * 40); voiceTone(110, 'sine', 0.05, 0.06, 800, 0.95); return; }

    voiceTone(320 + r() * 160, 'sawtooth', 0.04, 0.07, 1400, 0.75, r() * 80); voiceTone(80, 'sine', 0.08, 0.08, 600, 0.8);

    if (Math.random() < 0.6) voiceBreath(0.16, 380, 0.1);

}

    const joey = dialog.speaker === 'Joey', st = joey ? joeyStage() : 0;
    const speed = monster ? .016 : dialog.crash && dialog.i === 1 ? .02 : joey && st >= 5 ? .026 : joey && st >= 4 ? .033 : joey && st >= 3 ? .039 : .045;

    if (ny >= MH) startFade(() => switchMap('town', player.x + 15, 0, 'down'));

  if (curMap === 'glitchhaus') {
    if (ny >= MH) startFade(() => switchMap('void', 10, 7, 'down'));
    return;

  if (curMap === 'void') {
    if (ny >= MH) startFade(() => switchMap('town', 78, 3, 'left'));

  }
  if (curMap.startsWith('house:')) {
    if (ny >= MH && lastDoor) startFade(() => switchMap('town', lastDoor.x, lastDoor.y + 1, 'down'), '', 0, () => {

let curSong = null, songGen = 0, songGain = null;
function playSong(id) {
  if (!AC || curSong === id) return;
  curSong = id; const gen = ++songGen;
  if (songGain) { const old = songGain; old.gain.setTargetAtTime(0, AC.currentTime, 0.4); setTimeout(() => old.disconnect(), 3000); }

function tone(freq, t, dur, type, vol, out = master, opts) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = freq;
  if (opts && o.detune) {
    if (opts.det) o.detune.value = opts.det;
    if (opts.vib) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 3 + Math.random() * 3; lg.gain.value = opts.vib; l.connect(lg); lg.connect(o.detune); l.start(t); l.stop(t + dur + 0.05); }
  }
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.setValueAtTime(vol, t + Math.max(0.02, dur - 0.05));
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.connect(g); g.connect(out);
  o.start(t); o.stop(t + dur + 0.02);
}

const CREEP = [
  { tempo: 1.00, shift: 0,  wrong: 0,    drop: 0,    det: 0,  vib: 0,  dbl: 0,    drone: 0 },
  { tempo: 1.04, shift: 0,  wrong: 0.06, drop: 0,    det: 8,  vib: 0,  dbl: 0,    drone: 0 },
  { tempo: 1.12, shift: 0,  wrong: 0.14, drop: 0.05, det: 18, vib: 6,  dbl: 0.15, drone: 0.03 },
  { tempo: 1.25, shift: -1, wrong: 0.22, drop: 0.10, det: 30, vib: 14, dbl: 0.45, drone: 0.05 },
  { tempo: 1.45, shift: -3, wrong: 0.32, drop: 0.18, det: 45, vib: 26, dbl: 0.75, drone: 0.07 },
  { tempo: 1.70, shift: -5, wrong: 0.42, drop: 0.26, det: 60, vib: 40, dbl: 1.00, drone: 0.09 },

function scheduleLoop(start, gen) {
  if (!musicOn || gen !== songGen) return;
  const C = CREEP[joeyStage()], S = SONGS[curSong], e = S.e8 * C.tempo, out = songGain;
  const shift = fr => fr * Math.pow(2, C.shift / 12), det = k => (Math.random() - .5) * 2 * C.det * k;
  let t = 0;
  for (const [n, l] of S.mel) {
    if (n && Math.random() >= C.drop) {
      let fr = shift(nf(n));
      if (Math.random() < C.wrong) fr *= Math.pow(2, (Math.random() < .5 ? -1 : 1) / 12);     // ein Halbton daneben
      tone(fr, start + t * e, l * e * 0.92, S.mt, S.mv, out, { det: det(1), vib: C.vib });
      if (Math.random() < C.dbl) tone(fr * Math.pow(2, -6 / 12), start + t * e + e * 0.5, l * e * 0.8, 'sine', S.mv * 0.6, out, { det: det(1.5), vib: C.vib * 1.5 });
    }
    t += l;
  }
  S.bass.forEach(([r, f], bar) => {
    [r, f, r, f].forEach((n, q) => tone(shift(nf(n)), start + (bar * 8 + q * 2) * e, 2 * e * 0.85, S.bt, S.bv, out, { det: det(0.5), vib: C.vib * 0.5 }));
  });
  const len = t * e;
  if (C.drone) {                                                    // tiefes, schiefes Brummen unter allem
    const root = shift(nf(S.bass[0][0])) / 2;

}

  position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%, -50%)',
  maxWidth: '100vw', maxHeight: '100vh', opacity: '0', transition: 'opacity 3s ease-in',
  pointerEvents: 'none', zIndex: '20', display: 'none', imageRendering: 'auto',
});
document.body.appendChild(endImg);
function showEndImage() {
  if (endImg.style.display === 'block') return;
  endImg.style.display = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => { endImg.style.opacity = '1'; }));
}
function crashGame(code) {
  if (code) crashCode = code;
  if (state === 'crash') return;
  state = 'crash';
  crashStart = performance.now();
  frozen = mk(x => x.drawImage(cv, 0, 0), GW, GH);
  dialog = null; held.length = 0;
  document.title = 'UncozyCraft (Keine Rückmeldung)';
  cv.style.cursor = 'wait';
  document.querySelectorAll('#pad, #btnA').forEach(el => el.style.display = 'none');
  // Musik abwürgen, Audio "hängt" mit einem Brummen
  musicOn = false;
  if (AC) {
    master.disconnect();
    if (droneGain) droneGain.disconnect();
    if (nightGain) nightGain.disconnect();
    const len = Math.floor(AC.sampleRate * 0.06), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.sin(i / 7) > 0 ? 0.25 : -0.25) + (Math.random() - .5) * 0.3;
    const src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = buf; src.loop = true; g.gain.value = muted ? 0 : 0.35;
    src.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime + 1.8);
  }
}
function drawCrash() {
  const t = performance.now() - crashStart;
  if (t < 1500) {
    ctx.drawImage(frozen, 0, 0);
    const n = 1 + t / 120 | 0;
    for (let i = 0; i < n; i++) {
      const y = Math.random() * GH | 0, h = 1 + (Math.random() * 12 | 0), dx = ((Math.random() - .5) * 40) | 0;
      ctx.drawImage(frozen, 0, y, GW, h, dx, y, GW, h);
    }
    for (let i = 0; i < n / 3; i++) ctx.drawImage(MISSING, (Math.random() * 16 | 0) * 16, (Math.random() * 15 | 0) * 16);
    return;
  }
  if (t < 1900) {
    for (let y = 0; y < GH; y += 4) {
      ctx.fillStyle = ['#f800f8', '#00f8f8', '#000', '#fff', '#202020'][Math.random() * 5 | 0];
      ctx.fillRect(0, y, GW, 4);
    }
    return;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
  if (t < 2600) return;
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'start';
  const L = ['UncozyCraft.exe', 'funktioniert nicht mehr.', '', 'FEHLER 0x0000DEAD', crashCode, '', 'Das Spiel wurde beendet.'];
  L.forEach((l, i) => { ctx.fillStyle = i >= 3 && i <= 4 ? '#ff5555' : '#c0c0c0'; ctx.fillText(l, 16, 40 + i * 14); });
  if (t > 11000 && crashCode !== 'BRUECKE_STEHT') { ctx.fillStyle = '#880000'; ctx.fillText('warum hast du nachgesehen?', 16, 200); }
  // Nach dem Absturz an der Brücke: das End-Bild wird eingeblendet und bleibt stehen
  if (crashCode === 'BRUECKE_STEHT' && t > 6000) showEndImage();
  if (crashCode === 'BRUECKE_STEHT' && t > 16000 && t < 20000) {           // das End-Bild zerfällt
    endImg.style.transition = 'none'; endImg.style.opacity = Math.random() < .15 ? '0' : '1';
    const dx = (Math.random() - .5) * (t - 16000) / 40, dy = (Math.random() - .5) * 20;
    endImg.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scaleX(' + (1 + (Math.random() - .5) * .2) + ')';
    endImg.style.filter = 'hue-rotate(' + (Math.random() * 360 | 0) + 'deg) contrast(' + (1 + Math.random() * 3) + ')' + (Math.random() < .2 ? ' invert(1)' : '');
    if (Math.random() < .1) for (let y = 0; y < GH; y += 4) { ctx.fillStyle = ['#f800f8', '#00f8f8', '#000', '#fff'][Math.random() * 4 | 0]; ctx.fillRect(0, y, GW, 4); }
  }
  if (((crashCode === 'BRUECKE_STEHT' && t >= 20000) || (crashCode === 'WAHRE_WELT' && t >= 7000)) && !crashReloading) {
    crashReloading = true;
    endImg.style.display = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
    try { localStorage.setItem('uncozy_loop', String(crashCode === 'WAHRE_WELT' ? 3 : Math.max(LOOP, 2))); sessionStorage.setItem('uncozy_autointro', '1'); } catch (e) {}
    setTimeout(() => location.reload(), 1200);
  }
}

let last = null;
function loop(ts) {
  const dt = last === null ? 16 : Math.min(ts - last, 50);
  last = ts;
  if (state === 'crash') drawCrash();
  else { update(dt); draw(ts); if (chapterEnd) drawChapterEnd(); if (jumpscare) drawJumpscare(); }
  requestAnimationFrame(loop);
}

const fontReady = document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  requestAnimationFrame(loop);
  // direkt nach dem Ende: kein Titelbild, das Intro beginnt sofort von vorn
  try { if (sessionStorage.getItem('uncozy_autointro')) { sessionStorage.removeItem('uncozy_autointro'); startGame(); } } catch (e) {}
});
</script>
</body>
</html>
