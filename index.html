<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>UncozyCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #pad { display: none; position: fixed; left: 16px; bottom: 24px; width: 144px; height: 144px; z-index: 5; }
  #pad div, #btnA {
    position: absolute; width: 48px; height: 48px;
    border: 2px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1);
    border-radius: 4px; color: rgba(255,255,255,.7); font: 16px monospace;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #pu { left: 48px; top: 0; } #pd { left: 48px; top: 96px; }
  #pl { left: 0; top: 48px; } #pr { left: 96px; top: 48px; }
  #btnA { display: none; position: fixed; right: 24px; bottom: 60px; width: 64px; height: 64px; z-index: 5; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="pad"><div id="pu">▲</div><div id="pl">◀</div><div id="pr">▶</div><div id="pd">▼</div></div>
<div id="btnA">A</div>
<script>
// ─── SETUP ───────────────────────────────────────────────────
const T = 16, VW = 16, VH = 15, GW = VW * T, GH = VH * T;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = GW; cv.height = GH;
ctx.imageSmoothingEnabled = false;

function resize() {
  let s = Math.min(innerWidth / GW, innerHeight / GH);
  if (s >= 1) s = Math.floor(s);
  cv.style.width = GW * s + 'px';
  cv.style.height = GH * s + 'px';
}
addEventListener('resize', resize); resize();

const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0);
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ─── KARTE ───────────────────────────────────────────────────
let MW = 82, MH = 36, curMap = 'town';
let M = Array.from({ length: MH }, () => Array(MW).fill('.'));
const rect = (x, y, w, h, c) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) M[j][i] = c; };
const set = (x, y, c) => { M[y][x] = c; };
const hedge = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) M[j][i] = hash(i, j) % 3 === 0 ? 'f' : 'b'; };

// Texte für einzelne Felder (Schilder, Türen), Schlüssel "karte:x,y"
const SPOT_TEXT = {};
const spot = (x, y) => curMap + ':' + x + ',' + y;
const HOUSES = [];
function house(x, y, owner, gen, pathLen) {
  rect(x, y, 5, 2, 'r');
  rect(x, y + 2, 5, 2, 'h');
  set(x + 1, y + 2, 'n'); set(x + 3, y + 2, 'n');
  set(x + 2, y + 3, 'd');
  rect(x + 2, y + 4, 1, pathLen, 's');           // Weg von der Tür
  set(x + 3, y + 4, 'x');                        // Schild neben der Tür
  SPOT_TEXT[spot(x + 3, y + 4)] = ['~ ' + gen + ' Haus ~', 'Hier wohnt ' + owner + '.'];
  HOUSES.push({ owner, door: { x: x + 2, y: y + 3 } });
}

// ── Stadt ──
rect(0, 0, 1, MH, 't'); rect(MW - 1, 0, 1, MH, 't');
rect(1, 0, 13, 3, 't'); rect(30, 0, 13, 3, 't');
rect(14, 0, 3, 2, 't'); rect(27, 0, 3, 2, 't');
rect(1, 31, 4, 4, 't'); rect(39, 31, 4, 4, 't');
// Rechts der Stadt: eine riesige, dichte Hecke
hedge(43, 0, MW - 44, MH);
// Darin versteckt: ein langer, verwinkelter Gang. Die Felder sehen aus wie normale Hecke,
// man kann sie nur betreten (siehe SECRET in passable()).
const TUNNEL = [[43, 5], [55, 5], [55, 14], [68, 14], [68, 3], [78, 3]];
const tunnelTiles = [];
for (let i = 0; i < TUNNEL.length - 1; i++) {
  let [x, y] = TUNNEL[i]; const [x2, y2] = TUNNEL[i + 1];
  while (x !== x2 || y !== y2) { tunnelTiles.push([x, y]); x += Math.sign(x2 - x); y += Math.sign(y2 - y); }
}
tunnelTiles.push(TUNNEL[TUNNEL.length - 1]);
const PORTAL = { x: 79, y: 3 };   // Übergang ins Nichts (sieht auch aus wie Hecke)
const SECRET = new Set([...tunnelTiles, [PORTAL.x, PORTAL.y]].map(([x, y]) => x + ',' + y));
rect(0, MH - 1, MW, 1, 'm');
// Teich + Brücke
rect(17, 0, 10, 6, 'w');
for (let y = 3; y < 6; y++) { set(21, y, '['); set(22, y, ']'); }
// Die Brücke ist zerstört: abgebrochene Planken, danach nur noch Wasser und ein paar Pfosten
set(21, 2, '{'); set(22, 2, '}');
set(21, 1, 'p'); set(22, 0, 'p');
// Wege
rect(21, 6, 2, MH - 6, 's');      // Hauptweg bis zum Tor
rect(17, 7, 10, 4, 's');          // Platz
rect(2, 13, 40, 2, 's');          // Querweg oben
rect(2, 23, 40, 2, 's');          // Querweg unten
// Häuser – jeder Bewohner hat eins
house(3, 7,  'Danny',  'Dannys', 2);
house(10, 7, 'Gustav', 'Gustavs', 2);
house(29, 7, 'Paul',   'Pauls', 2);
house(36, 7, 'Lina',   'Linas', 2);
house(3, 16, 'Crisi', 'Crisis', 3);
rect(2, 21, 3, 1, 'k');           // Blumenbeet unter Crisis Haus
house(10, 16, 'Tony',  'Tonys', 3);
house(29, 16, 'Joyce', 'Joyces', 3);
house(36, 16, 'Otto',  'Ottos', 3);
house(8, 25, 'Raaven', 'Raavens', 2);
// Hecken
hedge(14, 2, 3, 4); hedge(27, 2, 3, 4);
hedge(15, 11, 5, 2); hedge(24, 11, 5, 2);
hedge(16, 16, 3, 4); hedge(25, 16, 3, 4);
hedge(4, 27, 3, 2); hedge(14, 27, 4, 2); hedge(26, 27, 14, 2);   // links Platz für Raavens Haus
// Deko
set(24, 8, 'u');                  // Brunnen
set(20, 12, 'x');                 // Ortsschild
SPOT_TEXT[spot(20, 12)] = ['~ UNCOZYCRAFT ~\nNorden: Brücke\nSüden: Stadttor'];
[[8, 8], [8, 18], [34, 8], [34, 18], [6, 32], [37, 32]].forEach(([x, y]) => set(x, y, 't'));
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++)
  if (M[y][x] === '.' && hash(x, y) % 13 === 0) M[y][x] = 'o';
const TOWN = { M, MW, MH };

// ── Die Leere: nur Schwarz, ganz oben das verglitchte Haus ──
const GLITCH = new Set(['R', 'H', 'N', 'D', 'X']);
curMap = 'void'; MW = 21; MH = 70;
M = Array.from({ length: MH }, () => Array(MW).fill('v'));
const GH_X = 10, GH_Y = 5;        // Mitte des Hauses
(function glitchHouse(x, y) {
  rect(x, y, 5, 2, 'R');
  rect(x, y + 2, 5, 2, 'H');
  set(x + 1, y + 2, 'N'); set(x + 3, y + 2, 'N');
  set(x + 2, y + 3, 'D');
  set(x + 3, y + 4, 'X');
  SPOT_TEXT[spot(x + 2, y + 3)] = ['D1e T#r 1st v3r$chl0ss3n.', 'v3rschl0ss3n.', 'v e r s c h l o s s e n'];
})(8, 3);
const GLITCH_SIGN = spot(11, 7);
const VOID = { M, MW, MH };
// ── Innenräume: 11x8, Ausgang (E) unten in der Mitte ──
const INTERIORS = {
  Gustav: ['WWKWWWWWKWW', 'FLLLLLFFFQF', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFGGGFFFFF', 'FFFGGGFFFCF', 'PFFFFFFFFFF', 'WWWWWEWWWWW'],
  Danny:  ['WWKWWWWWKWW', 'QFFFFFFOOFC', 'qFFFFFFFFFF', 'FFFJFFFAFFF', 'FFFFFFFFFFF', 'FFFGGGFFFFY', 'FFFGGGFFFFY', 'WWWWWEWWWWW'],
  Paul:   ['WWKWWWWWKWW', 'QFFFFFFFFCF', 'qFFFFFFFFFF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'YYFFFFFFFFY', 'YFFFFFFFFYY', 'WWWWWEWWWWW'],
  Lina:   ['WWKWWWWWKWW', 'PFFFFFFFFQP', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFFGGGFFFF', 'FFFFGGGFFCF', 'PFFFFFFFFFP', 'WWWWWEWWWWW'],
  Crisi: ['WWKWWWWWKWW', 'PPFFFFFFFQP', 'PFFFFFFFFqF', 'FFFFTTFFFFP', 'PFFFFFFFFFF', 'FFFGGGFFFFP', 'PPFFFFFFFPP', 'WWWWWEWWWWW'],
  Tony:   ['WWKWWWWWKWW', 'QFFFFFFFFFC', 'qFFFFFFFFFF', 'FFFFFFFFFFF', 'FFFGGGGGFFF', 'FFFGGGGGFFJ', 'FFFFFFFFFFF', 'WWWWWEWWWWW'],
  Joyce:  ['WWKWWWWWKWW', 'OOJFFFFFFQF', 'FFFFFFFFFqF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'YFFGGGFFFFP', 'YFFGGGFFFFF', 'WWWWWEWWWWW'],
  Raaven: ['WWKWWWWWKWW', 'FFFFFFFFLLL', 'FFFFFFFFFFF', 'FFFFTTFFFFC', 'FFFFFFFFFFF', 'YFFGGGFFFFP', 'FFFGGGFFFFF', 'WWWWWEWWWWW'],
  Otto:   ['WWKWWWWWKWW', 'QFFFFFFFFSS', 'qFFFFFFFFFF', 'FFFFTTFFFFF', 'FFFFFFFFFFF', 'CFFGGGFFFFS', 'CFFGGGFFFFF', 'WWWWWEWWWWW'],
};
// Besondere Texte pro Bewohner und Möbelstück
const INTERIOR_TEXT = {
  Gustav: { L: ['Alle Bücher haben denselben Titel:', '"UncozyCraft - Band 1"'] },
  Danny:  { A: ['Auf dem Amboss liegt ein halbfertiger Schlüssel.'] },
  Paul:   { C: ['In der Truhe liegt eine Angel.', 'Der Haken ist noch nie nass geworden.'], Y: ['Die Fässer sind leer.', 'Kein einziger Fisch.'] },
  Lina:   { Q: ['Linas Bett.', 'Unter dem Kissen liegt eine Zeichnung der Brücke.'], q: ['Linas Bett.', 'Unter dem Kissen liegt eine Zeichnung der Brücke.'] },
  Crisi: { P: ['Crisis Blumen.', 'Jede steht genau gleich weit vom Fenster weg.'] },
  Tony:   { C: ['Tonys Spielzeugkiste.', 'Ganz unten liegt ein Bild von zwei Jungen. Einer ist ganz schwarz.'] },
  Joyce:  { T: ['Der Tisch ist für zwei gedeckt.'] },
  Otto:   { S: ['Ottos Ersatzrüstung. Frisch poliert.'] },
  Raaven: { L: ['Raavens Regal ist voller glänzender Dinge.', 'Knöpfe, Schlüssel, Löffel...', '...und ein Glubschauge aus Glas.'], C: ['Raavens Truhe. Sie ist fest verschlossen.'] },
};
const MAPS = { town: TOWN, void: VOID };
for (const owner in INTERIORS) MAPS['house:' + owner] = { M: INTERIORS[owner].map(r => r.split('')), MW: 11, MH: 8 };

curMap = 'town'; ({ M, MW, MH } = TOWN);

const BLOCKED = new Set(['{', '}', 'p', 'k', 't', 'b', 'f', 'w', 'r', 'h', 'n', 'm', 'x', 'u', 'd', 'R', 'H', 'N', 'D', 'X',
  'W', 'K', 'Q', 'q', 'T', 'C', 'L', 'P', 'O', 'A', 'Y', 'S', 'J']);
// Blöcke mit Höhe (Pixel) – werden als 3D-Klötze gezeichnet
const HEIGHT = { t: 10, b: 6, f: 6, m: 6, u: 4, B: 6 };

// ─── TEXTUREN ────────────────────────────────────────────────
function mk(fn, w = T, h = T) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); fn(x); return c;
}
function P(x, px, py, w, h, col) { x.fillStyle = col; x.fillRect(px, py, w, h); }
function disc(x, cx, cy, r, col) {  x.fillStyle = col;  for (let yy = 0; yy < T; yy++) for (let xx = 0; xx < T; xx++) {    const dx = xx + .5 - cx, dy = yy + .5 - cy;    if (dx * dx + dy * dy <= r * r) x.fillRect(xx, yy, 1, 1);  }}
function noise(x, pal, seed, ax = 0, ay = 0, w = T, h = T) {
  const r = rng(seed);
  for (let j = ay; j < ay + h; j++) for (let i = ax; i < ax + w; i++) P(x, i, j, 1, 1, pal[r() * pal.length | 0]);
}

const PAL = {
  grass:  ['#5f9d32', '#6aab38', '#73b63e', '#58922d', '#68a636'],
  stone:  ['#7a7a7a', '#878787', '#6e6e6e', '#939393'],
  brick:  ['#7f7f7f', '#8b8b8b', '#757575', '#929292'],
  oak:    ['#a2834f', '#b4905a', '#9c7c48', '#a98a52'],
  spruce: ['#6b4a2a', '#5f4124', '#74512e', '#553a20'],
  leaves: ['#3f8a22', '#4c9a2a', '#357a1c', '#5aa832'],
  tree:   ['#2f6e1a', '#3a7f20', '#28601a', '#468c28'],
  water:  ['#3060d8', '#3468e0', '#2c58cc', '#2a50c0'],
  log:    ['#6b5233', '#5e4a2a', '#735a38'],
};

function grassTex(x, seed) { noise(x, PAL.grass, seed); }
function leavesTex(x, pal, seed) {
  const r = rng(seed);
  for (let j = 0; j < T; j++) for (let i = 0; i < T; i++) {
    const v = r();
    P(x, i, j, 1, 1, v < .12 ? '#1f4a12' : v > .93 ? '#7cc44a' : pal[r() * pal.length | 0]);
  }
}
function planksTex(x, pal, seam, seed, vertical = false) {
  noise(x, pal, seed);
  const seams = [3, 11, 7, 13];
  for (let k = 0; k < 4; k++) {
    if (vertical) { P(x, k * 4 + 3, 0, 1, T, seam); P(x, k * 4, seams[k], 3, 1, seam); }
    else { P(x, 0, k * 4 + 3, T, 1, seam); P(x, seams[k], k * 4, 1, 3, seam); }
  }
}
function cobbleTex(x, seed) {
  noise(x, PAL.stone, seed);
  const S = [[0, 0, 6, 5], [6, 0, 5, 4], [11, 0, 5, 6], [0, 5, 4, 5], [4, 4, 7, 6], [11, 6, 5, 4], [0, 10, 5, 6], [5, 10, 6, 6], [11, 10, 5, 6]];
  const r = rng(seed + 7);
  S.forEach(([a, b, w, h]) => {
    if (r() < .5) noise(x, ['#8f8f8f', '#9c9c9c', '#858585'], seed + a * 31 + b, a, b, w - 1, h - 1);
    P(x, a + w - 1, b, 1, h, '#454545'); P(x, a, b + h - 1, w, 1, '#454545');
    P(x, a, b, 1, 1, '#a8a8a8');
  });
}
function brickTex(x, seed) {
  noise(x, PAL.brick, seed);
  for (let row = 0; row < 4; row++) {
    P(x, 0, row * 4 + 3, T, 1, '#4f4f4f');
    const o = row % 2 ? 3 : 7;
    P(x, o, row * 4, 1, 3, '#4f4f4f'); P(x, o + 8, row * 4, 1, 3, '#4f4f4f');
    P(x, 0, row * 4, T, 1, 'rgba(255,255,255,0.08)');
  }
}
function waterTex(x, f) {
  noise(x, PAL.water, 900 + f);
  const r = rng(50);
  for (let k = 0; k < 5; k++) {
    const y = (r() * T | 0), x0 = ((r() * T | 0) + f * 3) % T, len = 3 + (r() * 4 | 0);
    for (let i = 0; i < len; i++) P(x, (x0 + i) % T, y, 1, 1, '#5a8af0');
  }
  P(x, (5 + f * 5) % T, (3 + f * 6) % T, 1, 1, '#a8c8ff');
}

const TILES = {
  '.': [1, 2, 3].map(s => mk(x => grassTex(x, s))),
  'o': [mk(x => {
    grassTex(x, 4);
    P(x, 4, 6, 1, 4, '#2f6a1a'); P(x, 3, 4, 3, 2, '#d8281e'); P(x, 4, 4, 1, 1, '#f2d22e');
    P(x, 11, 9, 1, 4, '#2f6a1a'); P(x, 10, 8, 3, 2, '#f2d22e'); P(x, 11, 8, 1, 1, '#c89a10');
    P(x, 5, 9, 1, 1, '#3f8a22'); P(x, 12, 11, 1, 1, '#3f8a22');
  }), mk(x => {
    grassTex(x, 5);
    P(x, 9, 4, 1, 4, '#2f6a1a'); P(x, 8, 2, 3, 2, '#d8281e'); P(x, 9, 2, 1, 1, '#1a1a1a');
    P(x, 3, 10, 1, 3, '#2f6a1a'); P(x, 2, 8, 3, 2, '#9fc8f0'); P(x, 3, 8, 1, 1, '#f2d22e');
  })],
  'b': [1, 2].map(s => mk(x => leavesTex(x, PAL.leaves, 100 + s))),
  'f': [mk(x => {
    leavesTex(x, PAL.leaves, 120);
    [[2, 3], [9, 2], [5, 9], [12, 11]].forEach(([a, b]) => { P(x, a, b, 2, 2, '#e88ac8'); P(x, a + 1, b + 1, 1, 1, '#c85aa8'); });
  })],
  't': [1, 2].map(s => mk(x => leavesTex(x, PAL.tree, 200 + s))),
  's': [1, 2, 3].map(s => mk(x => cobbleTex(x, 300 + s))),
  'w': [0, 1, 2].map(f => mk(x => waterTex(x, f))),
  '[': [mk(x => {
    planksTex(x, PAL.oak, '#6b5430', 400, true);
    noise(x, PAL.log, 401, 0, 0, 3, T); P(x, 3, 0, 1, T, '#3a2a14');
    for (let y = 1; y < T; y += 4) P(x, 1, y, 1, 2, '#4a3820');
  })],
  ']': [mk(x => {
    planksTex(x, PAL.oak, '#6b5430', 402, true);
    noise(x, PAL.log, 403, 13, 0, 3, T); P(x, 12, 0, 1, T, '#3a2a14');
    for (let y = 3; y < T; y += 4) P(x, 14, y, 1, 2, '#4a3820');
  })],
  'r': [mk(x => { planksTex(x, PAL.spruce, '#3e2914', 500); })],
  'h': [mk(x => { planksTex(x, PAL.oak, '#6b5430', 600); noise(x, PAL.log, 601, 0, 0, T, 2); P(x, 0, 2, T, 1, '#3a2a14'); })],
  'n': [mk(x => {
    planksTex(x, PAL.oak, '#6b5430', 610); noise(x, PAL.log, 611, 0, 0, T, 2); P(x, 0, 2, T, 1, '#3a2a14');
    P(x, 3, 4, 10, 10, '#5e4a2a'); P(x, 4, 5, 8, 8, '#b8dcec');
    P(x, 7, 5, 2, 8, '#5e4a2a'); P(x, 4, 8, 8, 1, '#5e4a2a');
    P(x, 5, 6, 1, 1, '#ffffff'); P(x, 10, 10, 1, 1, '#ffffff'); P(x, 11, 9, 1, 1, '#ffffff');
  })],
  'd': [mk(x => {
    planksTex(x, PAL.oak, '#6b5430', 620); noise(x, PAL.log, 621, 0, 0, T, 2); P(x, 0, 2, T, 1, '#3a2a14');
    P(x, 3, 3, 10, 13, '#3a2a14');
    noise(x, ['#7a5a32', '#86643a', '#6e5029'], 622, 4, 4, 8, 12);
    P(x, 5, 5, 2, 3, '#3a2a14'); P(x, 9, 5, 2, 3, '#3a2a14');
    P(x, 4, 10, 8, 1, '#5e4428'); P(x, 10, 11, 1, 1, '#2a2a2a');
  })],
  'm': [1, 2].map(s => mk(x => brickTex(x, 700 + s))),
  'x': [mk(x => {
    grassTex(x, 800);
    noise(x, PAL.log, 801, 7, 9, 2, 7);
    P(x, 1, 2, 14, 8, '#5e4a2a');
    noise(x, PAL.oak, 802, 2, 3, 12, 6);
    P(x, 4, 4, 8, 1, '#3a2a14'); P(x, 4, 6, 6, 1, '#3a2a14');
  })],
  'u': [mk(x => {
    cobbleTex(x, 850);
    P(x, 3, 3, 10, 10, '#454545');
    x.drawImage(mk(y => waterTex(y, 0)), 4, 4, 8, 8, 4, 4, 8, 8);
  })],
};
// Zerstörte Brücke (Überlagerungen, darunter wird animiertes Wasser gezeichnet)
const brokenBridge = left => mk(x => {
  const r = rng(left ? 1300 : 1301);
  for (let i = 0; i < 16; i++) {
    const h = 5 + (r() * 6 | 0);                       // gezackte Bruchkante
    for (let y = 16 - h; y < 16; y++) P(x, i, y, 1, 1, (i % 4 === 3) ? '#6b5430' : PAL.oak[r() * PAL.oak.length | 0]);
    P(x, i, 16 - h, 1, 1, '#c8a870');
  }
  if (left) { noise(x, PAL.log, 1302, 0, 9, 3, 7); P(x, 3, 9, 1, 7, '#3a2a14'); }
  else { noise(x, PAL.log, 1303, 13, 9, 3, 7); P(x, 12, 9, 1, 7, '#3a2a14'); }
  P(x, 4, 2, 6, 2, '#9c7c48'); P(x, 4, 2, 6, 1, '#b4905a'); P(x, 4, 4, 6, 1, '#5e4a2a');   // treibende Planke
});
TILES['{'] = [brokenBridge(true)];
TILES['}'] = [brokenBridge(false)];
TILES.p = [mk(x => {                  // abgebrochener Pfosten im Wasser
  P(x, 4, 12, 8, 1, '#68b0ff'); P(x, 3, 11, 1, 1, '#68b0ff'); P(x, 12, 11, 1, 1, '#68b0ff');
  noise(x, PAL.log, 1310, 6, 4, 4, 8); P(x, 6, 4, 4, 1, '#a08860'); P(x, 9, 5, 1, 7, '#4a3820');
})];
TILES.k = [mk(x => {                // Beet: Erde mit Furchen und Holzrand
  noise(x, ['#5a3a1e', '#4e321a', '#66442a'], 1200);
  for (let y = 4; y < 14; y += 3) P(x, 0, y, 16, 1, '#3e2814');

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0, g = Math.min(255, ((n >> 8) & 255) * f) | 0, b = Math.min(255, (n & 255) * f) | 0;

}

function outline(c) {

  for (let y = 0; y < SH; y++) for (let xx = 0; xx < SW; xx++) {
    const i = (y * SW + xx) * 4;
    if (s[i + 3]) continue;
    const near = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => {
      const X = xx + a, Y = y + b;
      return X >= 0 && X < SW && Y >= 0 && Y < SH && s[(Y * SW + X) * 4 + 3] > 0;
    });
    if (near) { o[i] = 26; o[i + 1] = 26; o[i + 2] = 26; o[i + 3] = 220; }
  }
  d.data.set(o); x.putImageData(d, 0, 0);
}

    R(8, 13, 4, 3 - ru, pantsD); R(8, 16 - ru, 4, 1, c.shoes);

// Dorfbewohner: Glatze, große Nase, Augenbraue, Gewand, verschränkte Arme
function drawVillager(x, c, dir, frame) {
  const R = (a, b, w, h, col) => P(x, a, b, w, h, col);
  const side = dir === 'left' || dir === 'right';
  if (dir === 'right') { x.translate(SW, 0); x.scale(-1, 1); }
  x.translate(0, 2);
  const skinD = shade(c.skin, .82), robeD = shade(c.robe, .75);

  // Füße (lugen unter dem Gewand hervor)
  const shoe = '#2a2a2a';
  if (!side) {
    if (frame !== 3) R(5, 16, 2, 1, shoe);
    if (frame !== 1) R(9, 16, 2, 1, shoe);
  } else {
    if (frame === 1) R(4, 16, 3, 1, shoe);
    else if (frame === 3) R(9, 16, 3, 1, shoe);

  // Gewand
  if (!side) {

    R(4, 13, 8, 1, c.accent);
    if (dir === 'down') {
      R(3, 10, 10, 3, robeD); R(3, 10, 10, 1, c.robe);   // verschränkte Arme

    } else {

  } else {
    R(5, 9, 6, 7, c.robe); R(10, 9, 1, 7, robeD); R(5, 15, 6, 1, robeD);

    R(3, 10, 4, 3, robeD); R(3, 10, 4, 1, c.robe); R(3, 11, 1, 1, c.skin);

    R(5, 4, 1, 1, '#ffffff'); R(6, 4, 1, 1, c.eye);
    R(9, 4, 1, 1, c.eye); R(10, 4, 1, 1, '#ffffff');
    R(7, 4, 2, 6, skinD);                               // große Nase
    R(7, 9, 2, 1, shade(c.skin, .7));

    R(4, 7, 8, 2, skinD);

function inMap(x, y) { return x >= 0 && y >= 0 && x < MW && y < MH; }
const activeEntities = () => [player, ...npcs.filter(n => n.map === curMap)];
function occupied(x, y, self) {
  return activeEntities().some(e => e !== self && ((e.x === x && e.y === y) || (e.tx === x && e.ty === y)));
}

const SECRET_ENTRY = { x: 43, y: 5 };
function passable(x, y, self) {
  if (curMap === 'town' && x === SECRET_ENTRY.x && y === SECRET_ENTRY.y && now().id !== 'night') return false;
  if (curMap === 'town' && SECRET.has(x + ',' + y)) return !occupied(x, y, self);
  if (vineInBlocks(x, y)) return false;
  if (noteHere(x, y)) return false;
  return inMap(x, y) && !BLOCKED.has(M[y][x]) && !occupied(x, y, self);
}
function startMove(e, dir) {
  const [dx, dy] = DIRS[dir];
  e.dir = dir;
  if (!passable(e.x + dx, e.y + dy, e)) return false;
  e.tx = e.x + dx; e.ty = e.y + dy; e.moving = true; e.prog = 0;
  return true;
}
function updateMove(e, dt) {
  if (e.moving) {
    e.prog += dt / e.dur;
    if (e.prog >= 1) { e.x = e.tx; e.y = e.ty; e.moving = false; e.prog = 0; e.steps++; }
  }
  e.px = (e.x + (e.tx - e.x) * e.prog) * T;
  e.py = (e.y + (e.ty - e.y) * e.prog) * T;
}
function frameOf(e) { return e.moving ? (e.steps * 2 + (e.prog < .5 ? 1 : 2)) % 4 : 0; }

function npcAI(e, dt) {
  if (e.moving) return;
  e.timer -= dt;
  if (e.timer > 0) return;
  e.timer = 1200 + Math.random() * 2500;
  const dir = ['up', 'down', 'left', 'right'][Math.random() * 4 | 0];
  const [dx, dy] = DIRS[dir];
  const nx = e.x + dx, ny = e.y + dy;
  if (e.radius && Math.abs(nx - e.home.x) <= e.radius && Math.abs(ny - e.home.y) <= e.radius) startMove(e, dir);
  else e.dir = dir;
}

let clockTarget = -60, clockAngle = -60, clockAnim = null;
// Pixel-Uhr: goldener Rahmen, oben ein Fenster mit drehender Scheibe (Tag = Himmel+Sonne, Nacht = Sterne+Mond)
function drawClock(ox, oy, deg, c2 = ctx) {
  const th = deg * Math.PI / 180, c = Math.cos(th), sn = Math.sin(th);
  for (let py = 0; py < 16; py++) for (let px = 0; px < 16; px++) {
    const dx = px + .5 - 8, dy = py + .5 - 8, r = Math.hypot(dx, dy);
    let col = null;
    if (r > 7.7) continue;
    else if (r > 6.8) col = '#4a2e06';
    else if (r > 5.4) col = (dx + dy < -2) ? '#ffe070' : (dx + dy > 3) ? '#b07810' : '#e8a820';
    else if (dy > 1) col = (dx + dy > 3) ? '#a86e10' : '#d09020';           // untere Hälfte: Gold
    else if (dy > 0) col = '#1a1208';                                         // Horizont-Schlitz
    else {
      // Fenster: gedrehte Scheibe
      const lx = c * dx + sn * dy, ly = -sn * dx + c * dy;
      if (ly < 0) {
        col = Math.hypot(lx, ly + 3.3) < 1.3 ? '#fff8a0' : Math.hypot(lx, ly + 3.3) < 2.1 ? '#f8d820' : '#3a5ad8';
      } else {
        col = Math.hypot(lx, ly - 3.3) < 1.9 ? '#e8e8f8' : ((px * 7 + py * 3) % 11 === 0 ? '#c8c8ff' : '#141a48');
      }
    }
    c2.fillStyle = col; c2.fillRect(ox + px, oy + py, 1, 1);
  }
}
let bannerText = '';

// Uhr-Animation beim Zeitwechsel: groß in die Mitte, umschlagen, zurück in die Ecke
const clockCv = document.createElement('canvas'); clockCv.width = clockCv.height = 16;
const clockCx = clockCv.getContext('2d');
function drawClockAnim() {
  if (fade && fade.clock) return true;
  clockAnim = null;

}
// Große Uhr in der Bildmitte, während man schläft
function drawSleepClock(fa) {
  const t = fade.t, big = 64, bx = (GW - big) / 2, by = (GH - big) / 2;
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  let deg = clockTarget;                                   // vor dem Zeitwechsel: alte Stellung
  if (fade.done && clockAnim) {
    const k = Math.max(0, Math.min(1, (t - 750) / (fade.hold - 300)));
    deg = clockAnim.from + (clockAnim.to - clockAnim.from) * ease(k);
    if (!fade.ticked && t > 750) { fade.ticked = true; blip(660, .05); }
  }
  clockCx.clearRect(0, 0, 16, 16);
  drawClock(0, 0, deg, clockCx);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = fa;
  ctx.drawImage(clockCv, bx, by, big, big);
  ctx.globalAlpha = 1;
}
function drawHUD(time) {
  drawInventory();
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'start';
  if (curMap === 'void') {

  } else {

  }
  if (performance.now() < bannerUntil && !fade) {
    const txt = bannerText, w = txt.length * 8 + 24;

}
function drawTimeTint(cx, cy, x0, y0, x1, y1) {
  if (curMap === 'void') return;

  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, GW, GH); }

function windowLit(x, y) {
  const h = HOUSES.find(h => x >= h.door.x - 2 && x <= h.door.x + 2 && y >= h.door.y - 3 && y <= h.door.y);
  if (!h) return true;
  if (h.owner === 'Joyce' && !quest.joyceLight) return false;
  const owner = npcs.find(n => n.name === h.owner);

const FIREFLIES = Array.from({ length: 28 }, () => ({ x: 0, y: 0, ph: Math.random() * 100, sp: .6 + Math.random() * .8, alive: false }));
function drawFireflies(cx, cy) {
  const t = performance.now();
  for (const f of FIREFLIES) {
    if (!f.alive || f.x < cx - 40 || f.x > cx + GW + 40 || f.y < cy - 40 || f.y > cy + GH + 40) {
      f.x = cx + Math.random() * GW; f.y = cy + Math.random() * GH; f.alive = true;
    }
    f.x += Math.sin(t * 0.0007 * f.sp + f.ph) * 0.35;
    f.y += Math.cos(t * 0.0009 * f.sp + f.ph * 2) * 0.28 - 0.03;
    const b = Math.max(0, Math.sin(t * 0.002 * f.sp + f.ph * 3));
    if (b < 0.05) continue;
    const sx = Math.round(f.x - cx), sy = Math.round(f.y - cy);
    ctx.fillStyle = 'rgba(190,255,90,' + (0.13 * b) + ')'; ctx.fillRect(sx - 2, sy - 2, 5, 5);
    ctx.fillStyle = 'rgba(210,255,120,' + (0.3 * b) + ')'; ctx.fillRect(sx - 1, sy - 1, 3, 3);
    ctx.fillStyle = 'rgba(240,255,170,' + b + ')'; ctx.fillRect(sx, sy, 1, 1);
  }
}

const LINE_W = 24;

function wrap(text) {
  const out = [];

      else if ((line + ' ' + w).length <= LINE_W) line += ' ' + w;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}
function say(texts, onClose, speaker) {
  const pages = [];

    const lines = wrap(t);
    for (let i = 0; i < lines.length; i += 3) pages.push(lines.slice(i, i + 3));
  }

function advanceDialog() {
  if (dialog.shown < pageLen()) { dialog.shown = pageLen(); return; }
  if (dialog.i < dialog.pages.length - 1) { dialog.i++; dialog.shown = 0; dialog.lastBlip = 0; blip(660, .04); return; }
  const cb = dialog.onClose, ch = dialog.choice;
  dialog = null; waitRelease = true;
  if (ch) { blip(660, .04); ch.onPick(ch.idx); }
  if (cb) cb();
}

function choiceNav(d) {

  dialog.choice.idx = 1 - dialog.choice.idx; blip(990, .03);
  return true;
}
function updateDialog(dt) {
  if (!dialog) return;
  const len = pageLen();
  if (dialog.shown < len) {

    if (n - dialog.lastBlip >= 2) { dialog.lastBlip = n; blip(dialog.crash && dialog.i === 1 ? 200 + Math.random() * 900 : 880, .025); }

  ['A5', 4], ['E5', 4],

  if (!droneGain) {
    droneGain = AC.createGain(); droneGain.gain.value = 0; droneGain.connect(AC.destination);
    [[55, 'sine'], [55.6, 'sine'], [110.3, 'triangle']].forEach(([hz, type]) => {
      const o = AC.createOscillator(); o.type = type; o.frequency.value = hz; o.connect(droneGain); o.start();
    });
  }
  droneGain.gain.setTargetAtTime(0, now, 0.8);   // in der Leere: Stille
  if (!nightGain) initNightAmbience();
  const nv = muted || name === 'void' || !isNight ? 0 : name.startsWith('house:') ? 0.4 : 1;
  nightGain.gain.setTargetAtTime(nv, now, 1.2);
}

function update(dt) {
  updateDialog(dt);
  if (fade) {
    fade.t += dt;
    if (!fade.done && fade.t >= 600) { fade.done = true; fade.cb(); }
    if (fade.t >= 1200 + fade.hold) { const e = fade.onEnd; fade = null; if (e) e(); }
  }
  // Am Ende des Heckengangs geht es in die Leere
  if (curMap === 'town' && !player.moving && !fade && player.x === PORTAL.x && player.y === PORTAL.y)
    startFade(() => switchMap('void', 10, VOID.MH - 2, 'up'));
  if (state === 'play' && !dialog && !fade && !cutscene && !textInput) {
    if (!held.length) waitRelease = false;
    if (!player.moving && held.length && !waitRelease) {
      const dir = held[held.length - 1];
      if (!startMove(player, dir)) {
        player.dir = dir;
        const [dx, dy] = DIRS[dir];
        const bx = player.x + dx, by = player.y + dy;
        if (curMap === 'town' && inMap(bx, by) && (M[by][bx] === '{' || M[by][bx] === '}')) say(['Die Brücke ist zerstört.', 'Hier kommst du nicht weiter.']);
        else if (!(dir === 'up' && tryDoor(bx, by))) edgeCheck(dir);
      }
    }
    npcs.forEach(n => { if (n.map === curMap) npcAI(n, dt); });
  }
  if (!dialog) all.forEach(e => updateMove(e, dt));
}

// ─── ZEICHNEN ────────────────────────────────────────────────
function textShadow(str, x, y, col, sh) {
  ctx.fillStyle = sh; ctx.fillText(str, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

let camX = 0, camY = 0;
function draw(time) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
  if (state === 'title') {
    camX = 22 * T - GW / 2 + Math.sin(time / 4000) * 40;     // Mitte der Stadt (Hauptweg)
    camY = 13 * T - GH / 2 + Math.cos(time / 5000) * 12;    // auf Höhe des oberen Querwegs
  } else {
    camX = MW * T <= GW ? (MW * T - GW) / 2 : Math.max(0, Math.min(player.px + 8 - GW / 2, MW * T - GW));
    camY = MH * T <= GH ? (MH * T - GH) / 2 : Math.max(0, Math.min(player.py + 8 - GH / 2, MH * T - GH));
  }
  const cx = Math.round(camX), cy = Math.round(camY);
  const x0 = Math.max(0, Math.floor(cx / T)), y0 = Math.max(0, Math.floor(cy / T));
  const x1 = Math.min(MW - 1, x0 + VW), y1 = Math.min(MH - 1, y0 + VH + 1);

  // 1) Boden (flache Tiles)
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const c = M[y][x];
    if (HEIGHT[c]) continue;
    if (c === '{' || c === '}' || c === 'p') ctx.drawImage(TILES.w[variant('w', x, y, time)], x * T - cx, y * T - cy);
    ctx.drawImage(TILES[c][variant(c, x, y, time)], x * T - cx, y * T - cy);
    if (curMap === 'town' && vineAlpha() > 0 && inVineHouse(x, y)) drawVines(x, y, x * T - cx, y * T - cy, M[y][x] === 'd');
    drawVinesInside(x, y, x * T - cx, y * T - cy);
    drawPlant(x, y, x * T - cx, y * T - cy);
    drawNote(x, y, x * T - cx, y * T - cy);
    if (curMap === 'town') drawBoards(c, x * T - cx, y * T - cy);
    if (GLITCH.has(c)) glitchTile(c, x * T - cx, y * T - cy);
  }
  // Schatten am Fuß hoher Blöcke (Ambient Occlusion)
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if (HEIGHT[M[y][x]] || y === 0 || !HEIGHT[M[y - 1][x]]) continue;
    ctx.fillRect(x * T - cx, y * T - cy, T, 3);
  }

  drawGoreGround(cx, cy);

  // 2) Reihenweise: hohe Blöcke, dann Figuren dieser Reihe
  const list = (state === 'title' ? npcs : activeEntities()).slice().sort((a, b) => a.py - b.py);
  for (let y = y0; y <= y1; y++) {
    for (let x = x0; x <= x1; x++) {
      const c = M[y][x], h = HEIGHT[c];
      if (!h) continue;
      const v = variant(c, x, y, time), sx = x * T - cx, sy = y * T - cy;
      ctx.drawImage(FACES[c][v], sx, sy + T - h);
      ctx.drawImage(TILES[c][v], sx, sy - h);
    }
    list.forEach(e => {
      if (Math.max(e.y, e.ty) !== y) return;
      const sx = Math.round(e.px) - cx, sy = Math.round(e.py) - cy;
      if (goreOn() && gore.dead.includes(e)) { drawDeadGiver(e, sx, sy); return; }
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(sx + 3, sy + 13, 10, 3);
      const struggling = hammerKill && e === hammerKill.d && hammerKill.weapon === 'flower' && !gore.dead.length;
      const shake = hammerKill && e === hammerKill.d && (struggling || performance.now() - hammerKill.lastHit < 140) ? (Math.random() < .5 ? -1 : 1) : 0;
      ctx.drawImage(sprite(e.look, e.dir, frameOf(e)), sx + shake, sy - 4);
      if (e === player && hammerKill) { if (hammerKill.hits && hammerKill.weapon !== 'flower') drawBloodyPlayer(sx, sy); drawWeaponSwing(sx, sy, cx, cy); }
      else if (e === player && goreOn()) { drawBloodyPlayer(sx, sy); drawKnife(e, sx, sy); }
      else if (e === player && performance.now() < glitchUntil) drawKnife(e, sx, sy);
    });
  }

  if (sceneFx && curMap === 'town') drawSceneFx(cx, cy);
  if (state === 'play') drawTimeTint(cx, cy, x0, y0, x1, y1);
  if (state === 'play') drawHouseLight(cx, cy);

  // Namensschilder über NPCs in der Nähe
  if (state === 'play' && !dialog) {
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    npcs.forEach(n => {
      if (n.map !== curMap) return;
      if (n.name === 'Tony' && quest.hide === 1) return;
      if (Math.abs(n.x - player.x) + Math.abs(n.y - player.y) > 2) return;
      const sx = Math.round(n.px) - cx + 8, sy = Math.round(n.py) - cy - 15;
      const w = n.name.length * 8 + 4;
      ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(sx - w / 2, sy - 1, w, 10);
      ctx.fillStyle = '#ffffff'; ctx.fillText(n.name, sx, sy);
    });
    ctx.textAlign = 'start';
  }

  // Je näher am verglitchten Haus, desto mehr flackert das Bild
  if (state === 'play' && curMap === 'void') {
    // leises Rauschen im Nichts
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for (let i = 0; i < 6; i++) ctx.fillRect(Math.random() * GW | 0, Math.random() * GH | 0, 1, 1);
    const d = Math.hypot(player.x - GH_X, player.y - GH_Y);
    const g = Math.max(0, 1 - d / 12);
    if (g > 0) {
      for (let i = 0; i < 3; i++) {
        if (Math.random() > g * 0.6) continue;
        const y = Math.random() * GH | 0, h = 1 + (Math.random() * 8 * g | 0), dx = ((Math.random() - .5) * 16 * g) | 0;
        ctx.drawImage(cv, 0, y, GW, h, dx, y, GW, h);
      }
      if (Math.random() < g * 0.05) blip(60 + Math.random() * 1500, 0.04);
    }
  }

  if (fade) {
    const fa = fade.t < 600 ? fade.t / 600 : fade.t < 600 + fade.hold ? 1 : 1 - (fade.t - 600 - fade.hold) / 600;
    ctx.fillStyle = `rgba(0,0,0,${fa})`; ctx.fillRect(0, 0, GW, GH);
    if (fade.clock) drawSleepClock(fa);
    if (fade.text && fa > 0.6) {
      ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255,255,255,${(fa - 0.6) / 0.4})`; ctx.fillText(fade.text, GW / 2, GH / 2 - 4);
      ctx.textAlign = 'start';
    }
  }

  drawCinema();
  if (state === 'play' && cinemaTarget === 0 && cinema < 0.05) drawHUD(time);
  if (state === 'title') drawTitle(time);
  if (dialog) drawDialog(time);
  drawTextInput(time);
  drawGlitch();
}

function drawTitle(time) {
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, GW, GH);
  // ab und zu verrutscht das Bild, alle paar Sekunden ein kurzer, stärkerer Glitch
  const burst = (time % 4300) < 160;
  const n = burst ? 7 : Math.random() < 0.12 ? 2 : 0;
  for (let i = 0; i < n; i++) {
    const y = Math.random() * GH | 0, h = 1 + (Math.random() * (burst ? 16 : 5) | 0), dx = ((Math.random() - .5) * (burst ? 40 : 12)) | 0;
    ctx.drawImage(cv, 0, y, GW, h, dx, y, GW, h);
  }
  if (burst) {
    ctx.drawImage(MISSING, (Math.random() * 16 | 0) * 16, (Math.random() * 15 | 0) * 16);
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = ['#f800f8', '#00f8f8'][Math.random() * 2 | 0];
    ctx.fillRect(0, Math.random() * GH | 0, GW, 4 + (Math.random() * 14 | 0));
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  ctx.font = '16px "Press Start 2P", monospace';
  // Blockige 3D-Schrift
  for (let i = 5; i >= 1; i--) { ctx.fillStyle = i === 5 ? '#000' : '#3a3a3a'; ctx.fillText('UNCOZYCRAFT', GW / 2, 72 + i); }
  if ((time % 4300) < 160 || Math.random() < 0.04) {
    const o = 1 + (Math.random() * 3 | 0);
    ctx.fillStyle = 'rgba(255,0,80,0.7)'; ctx.fillText('UNCOZYCRAFT', GW / 2 - o, 72);
    ctx.fillStyle = 'rgba(0,255,255,0.7)'; ctx.fillText('UNCOZYCRAFT', GW / 2 + o, 72);
  }
  ctx.fillStyle = '#d6d6d6'; ctx.fillText('UNCOZYCRAFT', GW / 2, 72);
  ctx.fillStyle = '#a8a8a8'; ctx.fillRect(GW / 2 - 88, 80, 176, 1);

  // Gelber Splash-Text
  ctx.save();
  ctx.translate(GW / 2 + 70, 100);
  ctx.rotate(-0.33);
  const s = 1 + Math.sin(time / 160) * 0.06;
  ctx.scale(s, s);
  ctx.font = '8px "Press Start 2P", monospace';
  textShadow('Total gemütlich!', 0, 0, '#ffff55', '#3f3f15');
  ctx.restore();

  if (Math.floor(time / 500) % 2 === 0) {
    ctx.font = '8px "Press Start 2P", monospace';
    textShadow(isTouch ? 'TIPPEN ZUM STARTEN' : 'DRÜCKE EINE TASTE', GW / 2, 160, '#ffffff', '#3f3f3f');
  }
  ctx.textAlign = 'start';
}

// ─── ABSTURZ ─────────────────────────────────────────────────
let crashStart = 0, frozen = null;
let crashCode = 'HAUS_BESITZER_UNBEKANNT';
// End-Bild als echtes Bild über dem Spiel (volle Auflösung, liegt als uncozy_ende.png neben dem Spiel)
const endImg = document.createElement('img');
endImg.src = 'uncozy_ende.png';
Object.assign(endImg.style, {
  position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%, -50%)',
  maxWidth: '100vw', maxHeight: '100vh', opacity: '0', transition: 'opacity 3s ease-in',
  pointerEvents: 'none', zIndex: '20', display: 'none', imageRendering: 'auto',
});
document.body.appendChild(endImg);
function showEndImage() {
  if (endImg.style.display === 'block') return;
  endImg.style.display = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => { endImg.style.opacity = '1'; }));
}
function crashGame(code) {
  if (code) crashCode = code;
  if (state === 'crash') return;
  state = 'crash';
  crashStart = performance.now();
  frozen = mk(x => x.drawImage(cv, 0, 0), GW, GH);
  dialog = null; held.length = 0;
  document.title = 'UncozyCraft (Keine Rückmeldung)';
  cv.style.cursor = 'wait';
  document.querySelectorAll('#pad, #btnA').forEach(el => el.style.display = 'none');
  // Musik abwürgen, Audio "hängt" mit einem Brummen
  musicOn = false;
  if (AC) {
    master.disconnect();
    if (droneGain) droneGain.disconnect();
    if (nightGain) nightGain.disconnect();
    const len = Math.floor(AC.sampleRate * 0.06), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.sin(i / 7) > 0 ? 0.25 : -0.25) + (Math.random() - .5) * 0.3;
    const src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = buf; src.loop = true; g.gain.value = muted ? 0 : 0.35;
    src.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime + 1.8);
  }
}
function drawCrash() {
  const t = performance.now() - crashStart;
  if (t < 1500) {
    ctx.drawImage(frozen, 0, 0);
    const n = 1 + t / 120 | 0;
    for (let i = 0; i < n; i++) {
      const y = Math.random() * GH | 0, h = 1 + (Math.random() * 12 | 0), dx = ((Math.random() - .5) * 40) | 0;
      ctx.drawImage(frozen, 0, y, GW, h, dx, y, GW, h);
    }
    for (let i = 0; i < n / 3; i++) ctx.drawImage(MISSING, (Math.random() * 16 | 0) * 16, (Math.random() * 15 | 0) * 16);
    return;
  }
  if (t < 1900) {
    for (let y = 0; y < GH; y += 4) {
      ctx.fillStyle = ['#f800f8', '#00f8f8', '#000', '#fff', '#202020'][Math.random() * 5 | 0];
      ctx.fillRect(0, y, GW, 4);
    }
    return;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
  if (t < 2600) return;
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'start';
  const L = ['UncozyCraft.exe', 'funktioniert nicht mehr.', '', 'FEHLER 0x0000DEAD', crashCode, '', 'Das Spiel wurde beendet.'];
  L.forEach((l, i) => { ctx.fillStyle = i >= 3 && i <= 4 ? '#ff5555' : '#c0c0c0'; ctx.fillText(l, 16, 40 + i * 14); });
  if (t > 11000 && crashCode !== 'BRUECKE_STEHT') { ctx.fillStyle = '#880000'; ctx.fillText('warum hast du nachgesehen?', 16, 200); }
  // Nach dem Absturz an der Brücke: das End-Bild wird eingeblendet und bleibt stehen
  if (crashCode === 'BRUECKE_STEHT' && t > 6000) showEndImage();
}

let last = null;
function loop(ts) {
  const dt = last === null ? 16 : Math.min(ts - last, 50);
  last = ts;
  if (state === 'crash') drawCrash();
  else { update(dt); draw(ts); }
  requestAnimationFrame(loop);
}

const fontReady = document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => requestAnimationFrame(loop));
</script>
