function mk(fn, w = T, h = T) {
  const c = document.createElement('canvas');
  if ((w === GW && h === GH) || (w === GW / 2 && h === GH / 2) || (w === GW / 4 && h === GH / 4)) hdify(c, w, h);   // Bildschirm-Ebenen: HD
  else { c.width = w; c.height = h; }
  const x = c.getContext('2d'); fn(x); return c;
}
function P(x, px, py, w, h, col) { x.fillStyle = col; x.fillRect(px, py, w, h); }
function disc(x, cx, cy, r, col) {  x.fillStyle = col;  for (let yy = 0; yy < T; yy++) for (let xx = 0; xx < T; xx++) {    const dx = xx + .5 - cx, dy = yy + .5 - cy;    if (dx * dx + dy * dy <= r * r) x.fillRect(xx, yy, 1, 1);  }}
function noise(x, pal, seed, ax = 0, ay = 0, w = T, h = T) {
  const r = rng(seed);
  for (let j = ay; j < ay + h; j++) for (let i = ax; i < ax + w; i++) P(x, i, j, 1, 1, pal[r() * pal.length | 0]);
}

};

function grassTex(x, seed) { noise(x, PAL.grass, seed); }
function leavesTex(x, pal, seed) {
  const r = rng(seed);
  for (let j = 0; j < T; j++) for (let i = 0; i < T; i++) {
    const v = r();
    P(x, i, j, 1, 1, v < .12 ? '#1f4a12' : v > .93 ? '#7cc44a' : pal[r() * pal.length | 0]);
  }
}
function planksTex(x, pal, seam, seed, vertical = false) {
  noise(x, pal, seed);
  const seams = [3, 11, 7, 13];
  for (let k = 0; k < 4; k++) {
    if (vertical) { P(x, k * 4 + 3, 0, 1, T, seam); P(x, k * 4, seams[k], 3, 1, seam); }
    else { P(x, 0, k * 4 + 3, T, 1, seam); P(x, seams[k], k * 4, 1, 3, seam); }
  }
}
function cobbleTex(x, seed) {
  noise(x, PAL.stone, seed);
  const S = [[0, 0, 6, 5], [6, 0, 5, 4], [11, 0, 5, 6], [0, 5, 4, 5], [4, 4, 7, 6], [11, 6, 5, 4], [0, 10, 5, 6], [5, 10, 6, 6], [11, 10, 5, 6]];
  const r = rng(seed + 7);
  S.forEach(([a, b, w, h]) => {
    if (r() < .5) noise(x, ['#8f8f8f', '#9c9c9c', '#858585'], seed + a * 31 + b, a, b, w - 1, h - 1);
    P(x, a + w - 1, b, 1, h, '#454545'); P(x, a, b + h - 1, w, 1, '#454545');
    P(x, a, b, 1, 1, '#a8a8a8');
  });
}
function brickTex(x, seed) {
  noise(x, PAL.brick, seed);
  for (let row = 0; row < 4; row++) {
    P(x, 0, row * 4 + 3, T, 1, '#4f4f4f');
    const o = row % 2 ? 3 : 7;
    P(x, o, row * 4, 1, 3, '#4f4f4f'); P(x, o + 8, row * 4, 1, 3, '#4f4f4f');
    P(x, 0, row * 4, T, 1, 'rgba(255,255,255,0.08)');
  }
}
function waterTex(x, f) {
  noise(x, PAL.water, 900 + f);
  const r = rng(50);
  for (let k = 0; k < 5; k++) {
    const y = (r() * T | 0), x0 = ((r() * T | 0) + f * 3) % T, len = 3 + (r() * 4 | 0);
    for (let i = 0; i < len; i++) P(x, (x0 + i) % T, y, 1, 1, '#5a8af0');
  }
  P(x, (5 + f * 5) % T, (3 + f * 6) % T, 1, 1, '#a8c8ff');
}

function corruptSkin(R, st, dir, frame, side) {                // Ziel: der Monster-Joey aus dem Portal – schwarz, Glubschaugen, weißes Grinsen
  if (!st) return;
  const V = '#c02030', VD = '#7a0010', CR = '#e02020', CRD = '#5a0a0a', SC = '#ece2d0', TW = '#ece4d4', MB = '#0a0000';
  const eye = (ex, ey, back) => {                               // Augapfel (4x5): Adern, rote Lidkante, Pupille schrumpft zum Stecknadelkopf
    R(ex, ey, 4, 5, st >= 3 ? SC : '#f0f0f0');
    R(ex, ey + 3, 1, 1, V);
    if (st >= 2) R(ex + 3, ey + 1, 1, 1, V);
    if (st >= 3) { R(ex, ey, 4, 1, VD); R(ex, ey + 4, 4, 1, '#1e0004'); }   // rote Lidkanten oben und unten trennen Auge und Grinsen
    const pw = st >= 3 ? 1 : st >= 2 ? 2 : 3;
    const px = back < 0 ? ex + 1 + (3 - pw) : ex + 1, py = ey + 1 + ((3 - pw) >> 1);
    if (st >= 3) { R(px - 1, py, 3, 1, '#4a0a0a'); R(px, py - 1, 1, 3, '#4a0a0a'); }
    R(px, py, pw, pw, '#000');
  };
  if (dir === 'down') {
    eye(3, 1, 1); eye(9, 1, -1);
    if (st === 2) { R(5, 7, 6, 1, MB); R(6, 7, 1, 1, TW); R(9, 7, 1, 1, TW); }                     // schmales Grinsen
    if (st >= 3) {                                                                                  // breites Zahngrinsen
      R(4, 6, 8, 1, TW); R(4, 7, 8, 1, MB); R(5, 7, 1, 1, TW); R(8, 7, 1, 1, TW); R(10, 7, 1, 1, TW);
      R(3, 6, 1, 1, VD); R(12, 6, 1, 1, VD);
    }
    if (st >= 4) { R(3, 7, 1, 1, MB); R(12, 7, 1, 1, MB); R(6, 7, 1, 1, '#5a0010'); }               // von Ohr zu Ohr
  } else if (side) {
    eye(2, 1, 1);
    if (st === 2) R(4, 7, 3, 1, MB);
    if (st >= 3) { R(3, 6, 4, 1, TW); R(2, 6, 1, 1, VD); R(3, 7, 4, 1, MB); R(4, 7, 1, 1, TW); R(6, 7, 1, 1, TW); }
  }
  // wenige, glühende Risse in der schwarzen Haut
  if (st >= 1) R(side ? 9 : 8, 3, 1, 1, CRD);
  if (st >= 2) R(side ? 8 : 7, 0, 1, 2, CRD);
  if (st >= 3) { R(side ? 8 : 7, 0, 1, 1, CR); R(side ? 6 : 5, 9, 1, 2, CRD); R(side ? 6 : 5, 10, 1, 1, CR); }
  if (st >= 4) { R(side ? 9 : 10, 10, 1, 2, CRD); R(side ? 9 : 10, 10, 1, 1, CR); R(side ? 10 : 7, 4, 1, 1, CR); }
  if (dir === 'up' && st >= 3) { R(6, 2, 1, 3, CRD); R(6, 3, 1, 1, CR); R(9, 5, 1, 2, CRD); }
  // Hörner: rote Spitzen, später dunkler und glühend
  if (st >= 2) { R(5, -2, 1, 1, VD); R(side ? 9 : 10, -2, 1, 1, VD); }
  if (st >= 4) { R(5, -2, 1, 1, CR); R(side ? 9 : 10, -2, 1, 1, CR); R(4, -1, 1, 1, '#241612'); R(side ? 10 : 11, -1, 1, 1, '#241612'); }
  // Krallen
  if (st >= 3 && !side) { R(2, 13, 1, 1, TW); R(13, 13, 1, 1, TW); }
}

      const late = clockMin >= 1440;
      textShadow(clockText(), 25, 10, late ? '#ff6060' : '#ffffff', '#202020');
      if (curMap !== 'void') drawCalendar(26, 23);                  // Kalender mit der Tageszahl unter der Uhrzeit
      if (weather.rain) { const wx = 68, wy = 8, b = Math.floor(performance.now() / 300) % 2;   // kleine Regenwolke
        ctx.fillStyle = '#202020'; ctx.fillRect(wx, wy + 1, 12, 6); ctx.fillStyle = '#c8ccd8'; ctx.fillRect(wx + 1, wy + 2, 10, 4); ctx.fillRect(wx + 3, wy, 5, 2); ctx.fillStyle = '#9aa0b0'; ctx.fillRect(wx + 1, wy + 5, 10, 1);
        ctx.fillStyle = '#7ab0ff'; ctx.fillRect(wx + 2 + b, wy + 8, 1, 2); ctx.fillRect(wx + 6 - b, wy + 9, 1, 2); ctx.fillRect(wx + 9 + b, wy + 8, 1, 2); }
    }
  }
  if (clockMin > 1500 && state === 'play' && (curMap === 'town' || curMap.startsWith('house:'))) {   // Müdigkeit: Ränder werden schwarz
    const k = Math.min(1, (clockMin - 1500) / 60), pulse = 0.5 + 0.5 * Math.sin(performance.now() / 700);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = 'rgba(0,0,0,' + (k * (0.12 + pulse * 0.05)) + ')'; const m = i * 7; ctx.fillRect(0, 0, GW, 26 - m > 0 ? 26 - m : 0); ctx.fillRect(0, GH - Math.max(0, 26 - m), GW, Math.max(0, 26 - m)); ctx.fillRect(0, 0, Math.max(0, 26 - m), GH); ctx.fillRect(GW - Math.max(0, 26 - m), 0, Math.max(0, 26 - m), GH); }
  }
  drawDayCard();
  if (performance.now() < bannerUntil && !fade) {
    const txt = bannerText, w = txt.length * 8 + 24;
    drawPanel((GW - w) / 2, 60, w, 24);
    ctx.fillStyle = '#3f3f3f'; ctx.fillText(txt, (GW - w) / 2 + 12, 68);
  }
}
function drawTimeTint(cx, cy, x0, y0, x1, y1) {
  if (curMap === 'void' || curMap === 'glitchhaus' || curMap === 'raetsel' || curMap === 'jenseits') return;
  const indoor = curMap.startsWith('house:');
  if (UPRIGHT()) { if (now().id === 'night' && !indoor) { const pc = ctx; ctx = emCtx; try { drawFireflies(cx, cy); drawPlantFirefly(cx, cy); } finally { ctx = pc; } } return; }
  const V = vis(), tint = indoor ? V.tintIn : V.tint;
  if (tint[3] > 0.005) { ctx.fillStyle = rgba(tint); ctx.fillRect(0, 0, GW, GH); }
  if (V.rain > 0 && !indoor) { ctx.fillStyle = 'rgba(30,40,60,' + (0.22 * V.rain) + ')'; ctx.fillRect(0, 0, GW, GH); }
  if (LOOP >= 3 && !indoor) { ctx.fillStyle = 'rgba(70,30,30,0.22)'; ctx.fillRect(0, 0, GW, GH); }
  // Nachts leuchten die Fenster der Häuser
  if (now().id === 'night' && !indoor) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      if ((M[y][x] !== 'n' && M[y][x] !== 'g') || !windowLit(x, y)) continue;
      const sx = x * T - cx, sy = y * T - cy;
      ctx.fillStyle = 'rgba(255,190,80,0.12)'; ctx.fillRect(sx - 2, sy + 2, 20, 16);
      ctx.fillStyle = 'rgba(255,200,90,0.65)'; ctx.fillRect(sx + 4, sy + 5, 8, 8);
    }
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {     // Laternen leuchten
      if (M[y][x] !== '^') continue;
      const lx = x * T - cx + 8, ly = y * T - cy + 4 - (UPRIGHT() ? 16 : 0), fl = 0.85 + Math.random() * 0.15;
      for (const [r, al] of [[26, 0.07], [17, 0.08], [9, 0.10]]) {           // runder Lichtschein in Pixelstufen
        ctx.fillStyle = 'rgba(255,215,120,' + (al * fl) + ')';
        for (let dy = -r; dy < r; dy += 2) { const w = Math.round(Math.sqrt(r * r - dy * dy)); ctx.fillRect(lx - w, ly + 6 + dy, w * 2, 2); }
      }
      ctx.fillStyle = 'rgba(255,240,170,' + fl + ')'; ctx.fillRect(lx - 2, ly - 2, 4, 4);
    }
    drawFireflies(cx, cy);
    drawPlantFirefly(cx, cy);
  }
}
// Ein Fenster leuchtet nachts nur, wenn drinnen auch Licht ist:
// der Bewohner ist zu Hause – und bei Joyce erst, wenn die Glühwürmchen-Blume bei ihr steht
function windowLit(x, y) {
  const h = HOUSES.find(h => x >= h.door.x - 2 && x <= h.door.x + 2 && y >= h.door.y - 3 && y <= h.door.y);
  if (!h) return true;
  if (h.owner === 'Joyce' && !quest.joyceLight) return false;
  const owner = npcs.find(n => n.name === h.who);
  if (h.owner === 'Gustav') return (owner && owner.map === 'house:GustavBuero') || npcByName('Lucy').map === 'house:Gustav';   // Rathaus: Licht, wenn jemand arbeitet
  return !owner || owner.map === 'house:' + h.owner;
}
// Glühwürmchen: schweben nachts draußen um dich herum und blinken
const FIREFLIES = Array.from({ length: 28 }, () => ({ x: 0, y: 0, ph: Math.random() * 100, sp: .6 + Math.random() * .8, alive: false }));
function drawFireflies(cx, cy) {
  const t = performance.now();
  for (const f of FIREFLIES) {
    if (!f.alive || f.x < cx - 40 || f.x > cx + GW + 40 || f.y < cy - 40 || f.y > cy + GH + 40) {
      f.x = cx + Math.random() * GW; f.y = cy + Math.random() * GH; f.alive = true;
    }
    f.x += Math.sin(t * 0.0007 * f.sp + f.ph) * 0.35;
    f.y += Math.cos(t * 0.0009 * f.sp + f.ph * 2) * 0.28 - 0.03;
    const b = Math.max(0, Math.sin(t * 0.002 * f.sp + f.ph * 3));
    if (b < 0.05) continue;
    const sx = Math.round(f.x - cx), sy = Math.round(f.y - cy);
    ctx.fillStyle = 'rgba(190,255,90,' + (0.13 * b) + ')'; ctx.fillRect(sx - 2, sy - 2, 5, 5);
    ctx.fillStyle = 'rgba(210,255,120,' + (0.3 * b) + ')'; ctx.fillRect(sx - 1, sy - 1, 3, 3);
    ctx.fillStyle = 'rgba(240,255,170,' + b + ')'; ctx.fillRect(sx, sy, 1, 1);
  }
}

// kürzester Weg (Breitensuche) – gibt die erste Richtung zurück
function pathStep(e, tx, ty, adjacent) {

  while (q.length && n++ < 900) {
    const [x, y] = q.shift();
    if (isGoal(x, y) && (x !== e.x || y !== e.y)) { goal = [x, y]; break; }
    for (const d of ['up', 'down', 'left', 'right']) {
      const [dx, dy] = DIRS[d], nx = x + dx, ny = y + dy, k = key(nx, ny);
      if (prev.has(k) || !inMap(nx, ny) || !passable(nx, ny, e)) continue;
      prev.set(k, [key(x, y), d]); q.push([nx, ny]);
    }
  }
  if (!goal) return null;
  let k = key(goal[0], goal[1]), d = null;
  while (prev.get(k)) { const [pk, pd] = prev.get(k); d = pd; if (pk === start) break; k = pk; }

}

let treeFx = null;                                                           // { x, y, until, parts: [] }
async function forcedStep(n, dir) {                                          // ein Schritt ohne Kollision (nur in Zwischensequenzen)
  const [dx, dy] = DIRS[dir]; n.dir = dir;
  n.tx = n.x + dx; n.ty = n.y + dy; n.moving = true; n.prog = 0;
  await waitP(n.dur + 40);
  if (n.x !== n.tx || n.y !== n.ty) Object.assign(n, { x: n.tx, y: n.ty, px: n.tx * T, py: n.ty * T, moving: false });
}
function treeChips(x, y, n, cols, up) {
  const t0 = performance.now();
  for (let i = 0; i < n; i++) treeFx.parts.push({ x: x * T + 8 + (Math.random() - .5) * 6, y: y * T + 12, vx: (Math.random() - .5) * 0.09, vz: (up || 0.06) + Math.random() * 0.06, t0, c: cols[i % cols.length] });
}
function drawTreeFx(cx, cy) {
  if (!treeFx) return;
  const now = performance.now();
  treeFx.parts = treeFx.parts.filter(p => now - p.t0 < 900);
  for (const p of treeFx.parts) {
    const t = now - p.t0, h = p.vz * t - 0.00012 * t * t;
    if (h < -2) continue;
    ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - t / 900);
    ctx.fillRect(Math.round(p.x + p.vx * t - cx), Math.round(p.y - cy - Math.max(0, h)), 1, 1);
  }
  ctx.globalAlpha = 1;
}

  position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%, -50%)',
  maxWidth: '100vw', maxHeight: '100vh', opacity: '0', transition: 'opacity 3s ease-in',
  pointerEvents: 'none', zIndex: '20', display: 'none', imageRendering: 'auto',
});
document.body.appendChild(endImg);
function showEndImage() {
  if (endImg.style.display === 'block') return;
  endImg.style.display = 'block';
  requestAnimationFrame(() => requestAnimationFrame(() => { endImg.style.opacity = '1'; }));
}
function crashGame(code) {
  if (code) crashCode = code;
  if (state === 'crash') return;
  state = 'crash';
  crashStart = performance.now();
  frozen = mk(x => x.drawImage(cv, 0, 0), GW, GH);
  dialog = null; held.length = 0;
  document.title = 'UncozyCraft (Keine Rückmeldung)';
  cv.style.cursor = 'wait';
  document.querySelectorAll('#pad, #btnA').forEach(el => el.style.display = 'none');
  // Musik abwürgen, Audio "hängt" mit einem Brummen
  musicOn = false;
  if (AC) {
    master.disconnect();
    if (droneGain) droneGain.disconnect();
    if (nightGain) nightGain.disconnect();
    const len = Math.floor(AC.sampleRate * 0.06), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.sin(i / 7) > 0 ? 0.25 : -0.25) + (Math.random() - .5) * 0.3;
    const src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = buf; src.loop = true; g.gain.value = muted ? 0 : 0.35;
    src.connect(g); g.connect(AC.destination);
    src.start(); src.stop(AC.currentTime + 1.8);
  }
}
function drawCrash() {
  const t = performance.now() - crashStart;
  if (t < 1500) {
    ctx.drawImage(frozen, 0, 0);
    const n = 1 + t / 120 | 0;
    for (let i = 0; i < n; i++) {
      const y = Math.random() * GH | 0, h = 1 + (Math.random() * 12 | 0), dx = ((Math.random() - .5) * 40) | 0;
      ctx.drawImage(frozen, 0, y, GW, h, dx, y, GW, h);
    }
    for (let i = 0; i < n / 3; i++) ctx.drawImage(MISSING, (Math.random() * 16 | 0) * 16, (Math.random() * 15 | 0) * 16);
    return;
  }
  if (t < 1900) {
    for (let y = 0; y < GH; y += 4) {
      ctx.fillStyle = ['#f800f8', '#00f8f8', '#000', '#fff', '#202020'][Math.random() * 5 | 0];
      ctx.fillRect(0, y, GW, 4);
    }
    return;
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
  if (t < 2600) return;
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'start';
  const L = ['UncozyCraft.exe', 'funktioniert nicht mehr.', '', 'FEHLER 0x0000DEAD', crashCode, '', 'Das Spiel wurde beendet.'];
  L.forEach((l, i) => { ctx.fillStyle = i >= 3 && i <= 4 ? '#ff5555' : '#c0c0c0'; ctx.fillText(l, 16, 40 + i * 14); });
  if (t > 11000 && crashCode !== 'BRUECKE_STEHT') { ctx.fillStyle = '#880000'; ctx.fillText('warum hast du nachgesehen?', 16, 200); }
  // Nach dem Absturz an der Brücke: das End-Bild wird eingeblendet und bleibt stehen
  if (crashCode === 'BRUECKE_STEHT' && t > 6000) showEndImage();
  if (crashCode === 'BRUECKE_STEHT' && t > 16000 && t < 20000) {           // das End-Bild zerfällt
    endImg.style.transition = 'none'; endImg.style.opacity = Math.random() < .15 ? '0' : '1';
    const dx = (Math.random() - .5) * (t - 16000) / 40, dy = (Math.random() - .5) * 20;
    endImg.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scaleX(' + (1 + (Math.random() - .5) * .2) + ')';
    endImg.style.filter = 'hue-rotate(' + (Math.random() * 360 | 0) + 'deg) contrast(' + (1 + Math.random() * 3) + ')' + (Math.random() < .2 ? ' invert(1)' : '');
    if (Math.random() < .1) for (let y = 0; y < GH; y += 4) { ctx.fillStyle = ['#f800f8', '#00f8f8', '#000', '#fff'][Math.random() * 4 | 0]; ctx.fillRect(0, y, GW, 4); }
  }
  if (((crashCode === 'BRUECKE_STEHT' && t >= 20000) || (crashCode === 'WAHRE_WELT' && t >= 7000)) && !crashReloading) {
    crashReloading = true;
    endImg.style.display = 'none'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, GW, GH);
    try { localStorage.setItem('uncozy_loop', String(crashCode === 'WAHRE_WELT' ? 3 : Math.max(LOOP, 2))); sessionStorage.setItem('uncozy_autointro', '1'); } catch (e) {}
    setTimeout(() => location.reload(), 1200);
  }
}

function rageMusic() {
  // Joey rastet aus: die Musik verstummt sofort – danach kommt sie langsam zurück
    const raging = !!(dialog && dialog.rage) || (menuJoey.rage && performance.now() - menuJoey.rage < 4800);
    if (raging && !rageMuted && AC && master) {
      rageMuted = true; const t = AC.currentTime;
      for (const g of [master, nightGain]) if (g) { if (g.gain.cancelScheduledValues) g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.06); }
    } else if (!raging && rageMuted) { rageMuted = false; if (AC && master) setAmbience(curMap, true); }
}
let last = null; const hdPerf = { n: 0, sum: 0 };
function loop(ts) {
  const dt = last === null ? 16 : Math.min(ts - last, 50);
  last = ts;
  if (HDS > 2 && state === 'play' && !/hd=\d/.test(location.search)) {   // ruckelt es dauerhaft, startet das Spiel nächstes Mal eine HD-Stufe niedriger
    hdPerf.n++; hdPerf.sum += dt;
    if (hdPerf.n >= 300) { if (hdPerf.sum / hdPerf.n > 30) try { localStorage.setItem('uncozy_hds', HDS - 1); } catch (e) {} hdPerf.n = hdPerf.sum = 0; }
  }
  if (state === 'crash') drawCrash();
  else { try { rageMusic(); if (!(menuUI && menuUI.kind === 'pause')) update(dt); draw(ts); if (chapterEnd) drawChapterEnd(); if (jumpscare) drawJumpscare(); } catch (err) { if (!loop.errShown) { loop.errShown = true; console.error(err); } } }   // ein Fehler darf das Spiel nicht einfrieren
  requestAnimationFrame(loop);
}

const fontReady = document.fonts ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  requestAnimationFrame(loop);
  // direkt nach dem Ende: kein Titelbild, das Intro beginnt sofort von vorn
  try { if (sessionStorage.getItem('uncozy_autointro')) { sessionStorage.removeItem('uncozy_autointro'); startGame(); } } catch (e) {}
  if (START_MODE === 'fresh') startGame();                          // nach "Neues Spiel": direkt los, ohne nochmal auf Spielen zu klicken
  try { if (sessionStorage.getItem('uncozy_resume')) { sessionStorage.removeItem('uncozy_resume'); if (!resumeGame()) startGame(); } } catch (e) {}
});
</script>
